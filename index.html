<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Süper Beyin Laboratuvarı</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #FEF9E7;
            --primary: #6C5CE7;
            --accent: #FD79A8;
        }
        body {
            font-family: 'Fredoka', sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 24px;
            color: #2D3748;
            transition: background-color 0.3s ease;
        }
        .container {
            max-width: 880px;
            margin: 0 auto;
        }
        .header {
            background: linear-gradient(135deg, #6C5CE7, #a29bfe);
            color: white;
            padding: 24px;
            border-radius: 24px;
            text-align: center;
            box-shadow: 0 8px 24px rgba(108, 92, 231, 0.2);
            margin-bottom: 24px;
        }
        .card {
            background: #FFFFFF;
            padding: 24px;
            border-radius: 20px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.05);
            margin-bottom: 20px;
        }
        textarea {
            width: 100%;
            border-radius: 16px;
            border: 2px solid #E2E8F0;
            padding: 14px;
            font-size: 17px;
            font-family: inherit;
            box-sizing: border-box;
            outline: none;
            margin-top: 8px;
            height: 120px;
            resize: vertical;
        }
        .controls {
            display: flex;
            gap: 10px;
            align-items: center;
            margin: 14px 0;
            flex-wrap: wrap;
        }
        .btn-action {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 16px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            font-family: inherit;
            box-shadow: 0 4px 12px rgba(108, 92, 231, 0.2);
            transition: transform 0.2s;
        }
        .btn-action:hover { transform: scale(1.03); }
        
        .btn-female-tr { background: linear-gradient(135deg, #FD79A8, #E84393); }
        .btn-male-tr { background: linear-gradient(135deg, #0984E3, #74B9FF); }

        .output-container {
            position: relative;
            background-color: #FFFFFF;
            padding: 28px;
            border-radius: 20px;
            font-size: 24px;
            line-height: 2.3;
            border: 3px dashed var(--primary);
            min-height: 120px;
            margin-top: 20px;
        }
        .bionic-bold { color: var(--primary); font-weight: 800; }
        
        .word-span {
            cursor: pointer;
            padding: 2px 4px;
            border-radius: 6px;
            transition: background 0.15s ease;
        }
        .word-span:hover {
            background-color: rgba(108, 92, 231, 0.12);
        }
        .word-active {
            background-color: #FFEAA7 !important;
            border-bottom: 3px solid #FDCB6E;
        }
        
        .mode-box {
            background: #F1F2F6;
            padding: 12px 16px;
            border-radius: 14px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 10px;
            border-left: 5px solid var(--primary);
        }
        .radio-label {
            cursor: pointer;
            font-weight: 600;
            font-size: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .status-badge {
            display: inline-block;
            background: #00B894;
            color: white;
            padding: 4px 10px;
            border-radius: 8px;
            font-size: 12px;
            margin-bottom: 10px;
            display: none;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1 style="margin:0;">🧪 Süper Beyin Laboratuvarı 🚀</h1>
        <p style="margin:8px 0 0 0; font-size:17px;">Kelimeleri Işılda, Sesleri Kendi Temponda Yönet!</p>
    </div>

    <!-- Gemini OCR Bölümü (Çalıştığı için minimal tutuldu) -->
    <div class="card" style="padding:15px;">
        <label><b>📸 Kitap Sayfasını Oku (Gemini AI):</b></label>
        <div style="display:flex; gap:10px; margin-top:8px; align-items:center;">
            <input type="password" id="apiKeyInput" placeholder="API Anahtarı" style="width:200px; margin:0; padding:10px;">
            <input type="file" id="imageInput" accept="image/*">
            <span id="ocrProgress" style="display:none; color:var(--primary); font-weight:bold;">Okunuyor...</span>
        </div>
    </div>

    <div class="card">
        <label style="display:block;"><b>📝 Kâşifin Not Defteri:</b></label>
        <textarea id="textInput" oninput="applyBionic()">Bir zamanlar meraklı bir kâşif varmış. Süper Beyin Laboratuvarında yepyeni dünyalar keşfetmeye bayılırmış.</textarea>

        <!-- 3 KESİN OKUMA MODU -->
        <div class="mode-box">
            <span style="color:#2D3748;">🧭 <b>Nasıl Okuyalım? (Önce modunu seç, sonra sesi başlat)</b></span>
            
            <label class="radio-label">
                <input type="radio" name="readMode" value="selected" checked> 
                🎯 <b>1. Mod (Seçileni Oku):</b> Yukarıdaki defterden fareyle bir yeri seç (maviye boya) ve aşağıdaki ses butonuna bas. Sadece orayı okur.
            </label>
            
            <label class="radio-label">
                <input type="radio" name="readMode" value="fast"> 
                🚀 <b>2. Mod (Akıcı Hız):</b> Aşağıdaki masada herhangi bir kelimeye tıkla. Oradan itibaren normal konuşma hızıyla akar.
            </label>
            
            <label class="radio-label">
                <input type="radio" name="readMode" value="slow"> 
                🐢 <b>3. Mod (Tane Tane):</b> Aşağıdaki masada herhangi bir kelimeye tıkla. Ses yavaşlar ve ışık tane tane ilerler.
            </label>
        </div>

        <div class="controls" style="margin-top:15px;">
            <label>✨ <b>Harf Işığı (Biyonik):</b></label>
            <input type="range" id="bionicRange" min="20" max="80" value="50" onchange="applyBionic()">
        </div>

        <!-- GARANTİLİ YAPAY ZEKA SESLERİ -->
        <label style="display:block; margin-top:20px; font-size:18px;"><b>🎧 Stüdyo Sesleri (Gerçek İnsan Tınısı):</b></label>
        <div id="playingStatus" class="status-badge">🎶 Şu an oynatılıyor...</div>
        
        <div class="controls">
            <button class="btn-action btn-female-tr" onclick="triggerRead('Filiz')">🧚 Masalcı Peri (Kesin Kadın Sesi)</button>
            <button class="btn-action btn-male-tr" onclick="triggerRead('Kivanc')">🧙‍♂️ Bilge Kâşif (Kesin Erkek Sesi)</button>
            <button class="btn-action" style="background:#E17055;" onclick="stopAudio()">⏹️ Sesi Durdur</button>
        </div>
    </div>

    <!-- OKUMA MASASI -->
    <div class="output-container" id="outputArea">
        <div id="textOutput">Yazılar burada parlayacak...</div>
    </div>
</div>

<!-- MP3 Çalar Nesnesi -->
<audio id="aiAudioPlayer"></audio>

<script>
let wordsList = [];
let lightTimer = null;
let currentVoice = 'Filiz'; // Varsayılan Kadın
let isPlaying = false;

// Biyonik Kelime Rehberi
function applyBionic() {
    const text = document.getElementById('textInput').value;
    const ratio = document.getElementById('bionicRange').value / 100;
    if (!text.trim()) {
        document.getElementById('textOutput').innerHTML = "Yazılar burada parlayacak...";
        return;
    }

    wordsList = text.trim().split(/\s+/);
    const transformed = wordsList.map((word, idx) => {
        let bionicWord = "";
        if (word.length <= 2) {
            bionicWord = `<span class="bionic-bold">${word}</span>`;
        } else {
            const mid = Math.ceil(word.length * ratio);
            bionicWord = `<span class="bionic-bold">${word.slice(0, mid)}</span>${word.slice(mid)}`;
        }
        // Kelimeye tıklama olayı
        return `<span class="word-span" id="w_${idx}" onclick="wordClicked(${idx})">${bionicWord}</span>`;
    });

    document.getElementById('textOutput').innerHTML = transformed.join(' ');
}

// 1. AŞAMA: Ana Ses Tetikleyici (Butona basıldığında)
function triggerRead(voiceName) {
    currentVoice = voiceName;
    const mode = document.querySelector('input[name="readMode"]:checked').value;
    
    // Eğer 1. Mod seçiliyse (Seçileni Oku)
    if (mode === 'selected') {
        const textarea = document.getElementById('textInput');
        let selectedText = textarea.value.substring(textarea.selectionStart, textarea.selectionEnd).trim();
        
        // Eğer hiçbir yeri seçmediyse uyarı ver
        if (!selectedText) {
            alert("1. Modu seçtin ama not defterinde hiçbir yeri fareyle seçmedin (maviye boyamadın). Lütfen okutmak istediğin kısmı seç!");
            return;
        }
        
        // Sadece seçili metni MP3'e gönderip çal, ışık takibi yapma
        playStudioAudio(selectedText, voiceName, 1.0);
    } 
    else {
        alert("Bu modlar için (Akıcı veya Tane Tane) doğrudan aşağıdaki okuma masasındaki kelimelerin üzerine tıklamalısın! O kelimeden itibaren okumaya başlayacaktır.");
    }
}

// 2. AŞAMA: Kelimeye Tıklayınca Tetiklenen (Mod 2 ve Mod 3 için)
function wordClicked(startIndex) {
    const mode = document.querySelector('input[name="readMode"]:checked').value;
    
    if (mode === 'selected') {
        alert("Şu an 'Seçileni Oku' modundasın. Kelimeye tıklayarak okutmak için 2. (Akıcı) veya 3. (Tane Tane) modu seçmelisin.");
        return;
    }

    const remainingWords = wordsList.slice(startIndex);
    if (remainingWords.length === 0) return;
    
    const textToSpeak = remainingWords.join(' ');
    
    // Mod 3 (Tane Tane) seçiliyse sesi gerçek anlamda yavaşlatıyoruz (0.75x hız)
    const playbackSpeed = mode === 'slow' ? 0.75 : 1.0;
    
    // Sesi Başlat
    playStudioAudio(textToSpeak, currentVoice, playbackSpeed);

    // Işık Takibini Başlat
    startHighlighting(startIndex, mode);
}

// 3. AŞAMA: Garantili Stüdyo Sesi Motoru (Amazon Polly StreamElements API)
function playStudioAudio(text, voiceName, speedRate) {
    stopAudio(); // Önceki sesi kes
    
    if (!text) return;
    
    const player = document.getElementById('aiAudioPlayer');
    const badge = document.getElementById('playingStatus');
    
    // İnternetteki en güvenilir ve %100 cinsiyet garantili API uç noktası
    // Filiz -> Kadın, Kivanc -> Erkek
    const audioUrl = `https://api.streamelements.com/kappa/v2/speech?voice=${voiceName}&text=${encodeURIComponent(text)}`;
    
    player.src = audioUrl;
    player.playbackRate = speedRate; // Tane tane modunda sesi ağırlaştırır
    
    player.play().then(() => {
        isPlaying = true;
        badge.style.display = 'inline-block';
    }).catch(err => {
        alert("Ses çalınamadı. Lütfen internet bağlantını kontrol et.");
    });

    // Ses bitince ışıkları söndür
    player.onended = () => {
        stopAudio();
    };
}

// 4. AŞAMA: Işık Takip Motoru
function startHighlighting(startIdx, mode) {
    let curr = startIdx;
    
    // Akıcı mod kelime başı ortalama süre: 380ms | Tane Tane mod süre: 700ms
    const interval = mode === 'slow' ? 700 : 380;

    function step() {
        if (!isPlaying) return; // Ses durdurulduysa ışığı da durdur
        
        if (curr < wordsList.length) {
            // Önceki ışıkları temizle, yenisini yak
            document.querySelectorAll('.word-span').forEach(el => el.classList.remove('word-active'));
            const target = document.getElementById(`w_${curr}`);
            if (target) target.classList.add('word-active');
            
            curr++;
            lightTimer = setTimeout(step, interval);
        }
    }
    step();
}

// Sesi ve Işıkları Komple Durdur
function stopAudio() {
    isPlaying = false;
    clearTimeout(lightTimer);
    const player = document.getElementById('aiAudioPlayer');
    player.pause();
    document.querySelectorAll('.word-span').forEach(el => el.classList.remove('word-active'));
    document.getElementById('playingStatus').style.display = 'none';
}

// GEMINI OCR (Sıfır Hata Motoru)
document.getElementById('imageInput').addEventListener('change', function(e) {
    const file = e.target.files[0];
    if (!file) return;

    const apiKey = document.getElementById('apiKeyInput').value.trim();
    if (!apiKey) {
        alert("Lütfen önce API Anahtarını girin.");
        return;
    }

    const prog = document.getElementById('ocrProgress');
    prog.style.display = 'inline-block';

    const reader = new FileReader();
    reader.readAsDataURL(file);
    reader.onload = (event) => {
        const img = new Image();
        img.src = event.target.result;
        img.onload = async () => {
            const canvas = document.createElement('canvas');
            const MAX_WIDTH = 1000;
            let width = img.width, height = img.height;
            if (width > MAX_WIDTH) { height = Math.round(height * MAX_WIDTH / width); width = MAX_WIDTH; }
            canvas.width = width; canvas.height = height;
            canvas.getContext('2d').drawImage(img, 0, 0, width, height);

            const optimizedBase64 = canvas.toDataURL('image/jpeg', 0.8).split(',')[1];

            try {
                const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{
                            parts: [
                                { text: "Görseldeki yazıyı harfi harfine oku. Yalnızca metni aktar." },
                                { inline_data: { mime_type: "image/jpeg", data: optimizedBase64 } }
                            ]
                        }]
                    })
                });
                const data = await res.json();
                if (data.candidates && data.candidates[0].content.parts[0].text) {
                    document.getElementById('textInput').value = data.candidates[0].content.parts[0].text.trim();
                    applyBionic();
                }
            } catch (err) { alert("Hata oluştu."); } 
            finally { prog.style.display = 'none'; }
        };
    };
});

window.onload = applyBionic;
</script>

</body>
</html>
