<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Süper Beyin Laboratuvarı</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #FEF9E7;
            --primary: #6C5CE7;
            --accent: #FD79A8;
        }
        body {
            font-family: 'Fredoka', sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 24px;
            color: #2D3748;
            transition: background-color 0.3s ease;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
        }
        .header {
            background: linear-gradient(135deg, #6C5CE7, #a29bfe);
            color: white;
            padding: 24px;
            border-radius: 24px;
            text-align: center;
            box-shadow: 0 8px 24px rgba(108, 92, 231, 0.2);
            margin-bottom: 24px;
        }
        .card {
            background: #FFFFFF;
            padding: 24px;
            border-radius: 20px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.05);
            margin-bottom: 20px;
        }
        .theme-btn {
            padding: 10px 18px;
            border-radius: 14px;
            border: 2px solid #E2E8F0;
            cursor: pointer;
            font-weight: 600;
            background: white;
            margin-right: 8px;
            margin-bottom: 8px;
            font-family: inherit;
            transition: all 0.2s;
        }
        .theme-btn:hover {
            border-color: var(--primary);
            transform: translateY(-2px);
        }
        textarea, input[type="password"] {
            width: 100%;
            border-radius: 16px;
            border: 2px solid #E2E8F0;
            padding: 14px;
            font-size: 17px;
            font-family: inherit;
            box-sizing: border-box;
            outline: none;
            margin-top: 8px;
        }
        textarea { height: 120px; resize: vertical; }
        .controls {
            display: flex;
            gap: 10px;
            align-items: center;
            margin: 14px 0;
            flex-wrap: wrap;
        }
        .btn-action {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 12px 18px;
            border-radius: 16px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            font-family: inherit;
            box-shadow: 0 4px 12px rgba(108, 92, 231, 0.1);
            transition: transform 0.2s;
        }
        .btn-action:hover { transform: scale(1.03); }
        .btn-female-tr { background: linear-gradient(135deg, #FD79A8, #E84393); }
        .btn-male-tr { background: linear-gradient(135deg, #0984E3, #74B9FF); }
        .btn-female-en { background: linear-gradient(135deg, #A29BFE, #6C5CE7); }
        .btn-male-en { background: linear-gradient(135deg, #55EFC4, #00B894); color: #2D3748; }
        
        .output-container {
            position: relative;
            background-color: #FFFFFF;
            padding: 28px;
            border-radius: 20px;
            font-size: 24px;
            line-height: 2.3;
            border: 3px dashed var(--primary);
            min-height: 120px;
            margin-top: 20px;
        }
        .reading-ruler {
            position: absolute;
            left: 0;
            right: 0;
            height: 52px;
            background: rgba(255, 234, 167, 0.45);
            border-top: 2px solid #FDCB6E;
            border-bottom: 2px solid #FDCB6E;
            pointer-events: none;
            display: none;
        }
        .bionic-bold { color: var(--primary); font-weight: 800; }
        
        .word-span {
            cursor: pointer;
            padding: 2px 6px;
            border-radius: 6px;
            transition: all 0.1s ease;
        }
        .word-span:hover { background-color: rgba(108, 92, 231, 0.12); }
        
        /* NET VE GÖRÜNÜR IŞIK VURGUSU */
        .word-active {
            background-color: #FFEB3B !important;
            color: #D35400 !important;
            font-weight: 900;
            border-bottom: 4px solid #E67E22;
            box-shadow: 0 4px 10px rgba(255, 235, 59, 0.5);
        }
        
        .mode-box {
            background: #F8F9FA;
            padding: 16px;
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 12px;
            border-left: 5px solid var(--primary);
        }
        .radio-label {
            cursor: pointer;
            font-weight: 600;
            font-size: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
            color: #4A5568;
        }
        input[type="radio"] { transform: scale(1.2); }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1 style="margin:0;">🧪 Süper Beyin Laboratuvarı 🚀</h1>
        <p style="margin:8px 0 0 0; font-size:17px;">Yapay Zeka Ses & Işık Destekli Okuma Alanı</p>
    </div>

    <!-- API Anahtarı ve AI OCR -->
    <div class="card" style="padding:18px; background:#F8F9FA;">
        <label><b>🔑 Laboratuvar Anahtarı & Sayfa Okuyucu (Gemini API):</b></label>
        <div style="display:flex; gap:10px; margin-top:10px; align-items:center; flex-wrap:wrap;">
            <input type="password" id="apiKeyInput" placeholder="API Anahtarı" style="max-width:200px; margin:0;" onchange="saveKey()">
            <input type="file" id="imageInput" accept="image/*">
            <span id="ocrProgress" style="display:none; color:var(--primary); font-weight:bold;">AI Sayfayı okuyor...</span>
        </div>
    </div>

    <div class="card">
        <!-- Sayfa Işığı -->
        <label><b>🎨 Sayfa Işığı:</b></label><br>
        <div style="margin-top:10px;">
            <button class="theme-btn" onclick="setBg('#FEF9E7')">🍯 Bal Peteği</button>
            <button class="theme-btn" onclick="setBg('#E8F8F5')">🌱 Dinozor Nanesi</button>
            <button class="theme-btn" onclick="setBg('#FBEEE6')">🍑 Şeftali Bulutu</button>
            <button class="theme-btn" onclick="setBg('#EBF5FB')">🌊 Uzay Dalgası</button>
        </div>

        <label style="margin-top:18px; display:block;"><b>📝 Kâşifin Not Defteri:</b></label>
        <textarea id="textInput" oninput="applyBionic()">Bir zamanlar meraklı bir kâşif varmış. Bu kâşif yepyeni dünyalar keşfetmeye bayılırmış.</textarea>

        <!-- 3 OKUMA MODU -->
        <div class="mode-box">
            <span style="color:#2D3748; font-size:16px;">🧭 <b>Okuma Modu:</b></span>
            
            <label class="radio-label">
                <input type="radio" name="readMode" value="1" checked> 
                🎯 <b>1. Mod (Seçileni Oku):</b> Not defterinden fareyle seçtiğin kısmı okur.
            </label>
            
            <label class="radio-label">
                <input type="radio" name="readMode" value="2"> 
                🚀 <b>2. Mod (Akıcı Okuma):</b> Aşağıdaki masada tıkladığın kelimeden başlar, akıcı okur ve ışık takip eder.
            </label>
            
            <label class="radio-label">
                <input type="radio" name="readMode" value="3"> 
                🐢 <b>3. Mod (Tane Tane Okuma):</b> Aşağıdaki masada tıkladığın kelimeden başlar, yavaşça okur ve ışık sindire sindire ilerler.
            </label>
        </div>

        <!-- Harf Işığı -->
        <div class="controls" style="margin-top:15px;">
            <label>✨ <b>Harf Işığı (Biyonik):</b></label>
            <input type="range" id="bionicRange" min="20" max="80" value="50" onchange="applyBionic()">
            <label style="margin-left:14px; cursor:pointer; font-weight:600;">
                <input type="checkbox" id="rulerToggle" onchange="toggleRuler()"> 📏 <b>Sihirli Takip Çubuğu</b>
            </label>
        </div>

        <!-- 4 GARANTİ AI SES BUTONU -->
        <label style="display:block; margin-top:20px; font-size:16px;"><b>🎧 Yapay Zeka (AI) Ses Asistanları:</b></label>
        <div class="controls">
            <button class="btn-action btn-female-tr" onclick="playAI('tr', 'female')">🧚 Masalcı Peri (AI Kadın)</button>
            <button class="btn-action btn-male-tr" onclick="playAI('tr', 'male')">🧙‍♂️ Bilge Kâşif (AI Erkek)</button>
            <button class="btn-action btn-female-en" onclick="playAI('en', 'female')">👩‍🏫 Storyteller (EN Kadın)</button>
            <button class="btn-action btn-male-en" onclick="playAI('en', 'male')">👨‍🚀 Captain Explorer (EN Erkek)</button>
            <button class="btn-action" style="background:#E17055;" onclick="stopAudio()">⏹️ Durdur</button>
        </div>
    </div>

    <!-- OKUMA MASASI -->
    <div class="output-container" id="outputArea" onmousemove="moveRuler(event)">
        <div id="ruler" class="reading-ruler"></div>
        <div id="textOutput">Yazılar burada parlayacak...</div>
    </div>
</div>

<audio id="audioPlayer" style="display:none;"></audio>

<script>
let wordsList = [];
let activeTimer = null;

function setBg(color) {
    document.documentElement.style.setProperty('--bg-color', color);
}

// Biyonik ve Tıklanabilir Kelimeler
function applyBionic() {
    const text = document.getElementById('textInput').value;
    const ratio = document.getElementById('bionicRange').value / 100;
    if (!text.trim()) {
        document.getElementById('textOutput').innerHTML = "";
        return;
    }

    wordsList = text.trim().split(/\s+/);
    const transformed = wordsList.map((word, idx) => {
        let bionicWord = "";
        if (word.length <= 2) {
            bionicWord = `<span class="bionic-bold">${word}</span>`;
        } else {
            const mid = Math.ceil(word.length * ratio);
            bionicWord = `<span class="bionic-bold">${word.slice(0, mid)}</span>${word.slice(mid)}`;
        }
        return `<span class="word-span" id="w_${idx}" onclick="wordClicked(${idx})">${bionicWord}</span>`;
    });

    document.getElementById('textOutput').innerHTML = transformed.join(' ');
}

// Çubuk
function toggleRuler() {
    document.getElementById('ruler').style.display = document.getElementById('rulerToggle'].checked ? 'block' : 'none';
}
function moveRuler(e) {
    const ruler = document.getElementById('ruler');
    if (ruler.style.display === 'block') {
        const rect = document.getElementById('outputArea').getBoundingClientRect();
        const offsetY = e.clientY - rect.top - 24;
        ruler.style.top = Math.max(0, Math.min(offsetY, rect.height - 52)) + 'px';
    }
}

function highlightWord(idx) {
    document.querySelectorAll('.word-span').forEach(el => el.classList.remove('word-active'));
    const target = document.getElementById(`w_${idx}`);
    if (target) {
        target.classList.add('word-active');
        target.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }
}

function stopAudio() {
    clearTimeout(activeTimer);
    const player = document.getElementById('audioPlayer');
    player.pause();
    player.src = "";
    document.querySelectorAll('.word-span').forEach(el => el.classList.remove('word-active'));
}

// KESİN VE GARANTİLİ AI SES MOTORU (Amazon Polly Stüdyo Sesleri API)
function playAI(lang, gender) {
    stopAudio();
    const mode = document.querySelector('input[name="readMode"]:checked').value;
    const textarea = document.getElementById('textInput');

    let textToRead = "";
    let startIndex = 0;

    if (mode === '1') {
        // 1. Mod: Seçilen Parça
        textToRead = textarea.value.substring(textarea.selectionStart, textarea.selectionEnd).trim();
        if (!textToRead) {
            textToRead = textarea.value.trim(); // Seçilmediyse tamamı
        }
    } else {
        textToRead = textarea.value.trim();
    }

    if (!textToRead) return;

    // AI Ses Kodları: Filiz (TR Kadın), Filiz/Kivanc -> Kadın için Filiz, Erkek için Arda/Kivanc
    let voiceName = "Filiz"; // TR Kadın
    if (lang === 'tr' && gender === 'male') voiceName = "Kivanc"; // TR Erkek
    if (lang === 'en' && gender === 'female') voiceName = "Joanna"; // EN Kadın
    if (lang === 'en' && gender === 'male') voiceName = "Joey"; // EN Erkek

    const player = document.getElementById('audioPlayer');
    const audioUrl = `https://api.streamelements.com/kappa/v2/speech?voice=${voiceName}&text=${encodeURIComponent(textToRead)}`;
    
    player.src = audioUrl;
    
    // Mod 3 (Tane Tane) için ses hızını biraz yavaşlatıyoruz
    player.playbackRate = (mode === '3') ? 0.75 : 1.0;
    
    player.play().catch(() => {
        alert("Ses çalma tarayıcı tarafından engellendi, sayfada bir yere tıklayıp tekrar dene!");
    });

    // Işık Takibi (Eğer mod 2 veya 3 ise kelimeleri aydınlatarak akıt)
    if (mode === '2' || mode === '3') {
        startHighlightFlow(0, mode);
    }
}

// Masadaki kelimeye tıklandığında (Mod 2 ve Mod 3)
function wordClicked(idx) {
    const mode = document.querySelector('input[name="readMode"]:checked').value;
    if (mode === '1') {
        alert("Şu an '1. Mod (Seçileni Oku)' aktif. Kelimeden başlatmak için 2. veya 3. modu seçmelisin.");
        return;
    }

    const remainingWords = wordsList.slice(idx);
    if (remainingWords.length === 0) return;

    const textToRead = remainingWords.join(' ');
    
    // Ses çal
    const player = document.getElementById('audioPlayer');
    const audioUrl = `https://api.streamelements.com/kappa/v2/speech?voice=Filiz&text=${encodeURIComponent(textToRead)}`;
    player.src = audioUrl;
    player.playbackRate = (mode === '3') ? 0.75 : 1.0;
    player.play();

    // Işık takibini tıklanan indexten başlat
    startHighlightFlow(idx, mode);
}

// Canlı Işık Akış Motoru
function startHighlightFlow(startIdx, mode) {
    let curr = startIdx;
    const interval = (mode === '3') ? 700 : 380; // Tane tane: 700ms, Akıcı: 380ms

    function step() {
        if (curr < wordsList.length) {
            highlightWord(curr);
            curr++;
            activeTimer = setTimeout(step, interval);
        } else {
            document.querySelectorAll('.word-span').forEach(el => el.classList.remove('word-active'));
        }
    }
    step();
}

// API Kaydet
function saveKey() {
    const k = document.getElementById('apiKeyInput').value.trim();
    if (k) localStorage.setItem('superbrain_gemini_key', k);
}
window.onload = () => {
    const k = localStorage.getItem('superbrain_gemini_key');
    if (k) document.getElementById('apiKeyInput').value = k;
    applyBionic();
};

// GEMINI OCR (Sıfır Hata)
document.getElementById('imageInput').addEventListener('change', function(e) {
    const file = e.target.files[0];
    if (!file) return;

    const apiKey = document.getElementById('apiKeyInput').value.trim();
    if (!apiKey) {
        alert("Lütfen önce API Anahtarını girin.");
        return;
    }

    const prog = document.getElementById('ocrProgress');
    prog.style.display = 'inline-block';

    const reader = new FileReader();
    reader.readAsDataURL(file);
    reader.onload = (event) => {
        const img = new Image();
        img.src = event.target.result;
        img.onload = async () => {
            const canvas = document.createElement('canvas');
            const MAX_WIDTH = 1000;
            let width = img.width, height = img.height;
            if (width > MAX_WIDTH) { height = Math.round(height * MAX_WIDTH / width); width = MAX_WIDTH; }
            canvas.width = width; canvas.height = height;
            canvas.getContext('2d').drawImage(img, 0, 0, width, height);

            const optimizedBase64 = canvas.toDataURL('image/jpeg', 0.8).split(',')[1];

            try {
                const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{
                            parts: [
                                { text: "Görseldeki yazıyı harfi harfine oku. Yalnızca metni aktar." },
                                { inline_data: { mime_type: "image/jpeg", data: optimizedBase64 } }
                            ]
                        }]
                    })
                });
                const data = await res.json();
                if (data.candidates && data.candidates[0].content.parts[0].text) {
                    document.getElementById('textInput').value = data.candidates[0].content.parts[0].text.trim();
                    applyBionic();
                }
            } catch (err) { alert("Hata oluştu."); } 
            finally { prog.style.display = 'none'; }
        };
    };
});
</script>

</body>
</html>
