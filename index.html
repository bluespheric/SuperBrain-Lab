<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Süper Beyin Laboratuvarı</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #FEF9E7;
            --primary: #6C5CE7;
            --accent: #FD79A8;
        }
        body {
            font-family: 'Fredoka', sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 24px;
            color: #2D3748;
            transition: background-color 0.3s ease;
        }
        .container {
            max-width: 880px;
            margin: 0 auto;
        }
        .header {
            background: linear-gradient(135deg, #6C5CE7, #a29bfe);
            color: white;
            padding: 24px;
            border-radius: 24px;
            text-align: center;
            box-shadow: 0 8px 24px rgba(108, 92, 231, 0.2);
            margin-bottom: 24px;
        }
        .card {
            background: #FFFFFF;
            padding: 24px;
            border-radius: 20px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.05);
            margin-bottom: 20px;
        }
        .theme-btn {
            padding: 10px 18px;
            border-radius: 14px;
            border: 2px solid #E2E8F0;
            cursor: pointer;
            font-weight: 600;
            background: white;
            margin-right: 8px;
            margin-bottom: 8px;
            font-family: inherit;
            transition: all 0.2s;
        }
        .theme-btn:hover {
            border-color: var(--primary);
            transform: translateY(-2px);
        }
        textarea, input[type="password"] {
            width: 100%;
            border-radius: 16px;
            border: 2px solid #E2E8F0;
            padding: 14px;
            font-size: 17px;
            font-family: inherit;
            box-sizing: border-box;
            outline: none;
            margin-top: 8px;
        }
        textarea { height: 120px; resize: vertical; }
        .controls {
            display: flex;
            gap: 10px;
            align-items: center;
            margin: 14px 0;
            flex-wrap: wrap;
        }
        .btn-action {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 16px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            font-family: inherit;
            box-shadow: 0 4px 12px rgba(108, 92, 231, 0.2);
            transition: transform 0.2s;
        }
        .btn-action:hover { transform: scale(1.03); }
        .btn-save { background: #00B894; }
        .btn-female-tr { background: linear-gradient(135deg, #FD79A8, #E84393); }
        .btn-male-tr { background: linear-gradient(135deg, #0984E3, #74B9FF); }
        .btn-female-en { background: linear-gradient(135deg, #A29BFE, #6C5CE7); }
        .btn-male-en { background: linear-gradient(135deg, #55EFC4, #00B894); color: #2D3748; }

        .output-container {
            position: relative;
            background-color: #FFFFFF;
            padding: 28px;
            border-radius: 20px;
            font-size: 24px;
            line-height: 2.3;
            border: 3px dashed var(--primary);
            min-height: 120px;
            margin-top: 20px;
        }
        .reading-ruler {
            position: absolute;
            left: 0;
            right: 0;
            height: 52px;
            background: rgba(255, 234, 167, 0.45);
            border-top: 2px solid #FDCB6E;
            border-bottom: 2px solid #FDCB6E;
            pointer-events: none;
            display: none;
        }
        .bionic-bold { color: var(--primary); font-weight: 800; }
        .upload-zone {
            background: #F8F9FA;
            border: 2px dashed #CBD5E0;
            padding: 18px;
            border-radius: 16px;
            margin-top: 14px;
            text-align: center;
        }
        .status-msg {
            margin-top: 8px;
            font-weight: 600;
            font-size: 14px;
        }
        
        .word-span {
            cursor: pointer;
            padding: 2px 4px;
            border-radius: 6px;
            transition: background 0.15s ease;
        }
        .word-span:hover {
            background-color: rgba(108, 92, 231, 0.12);
        }
        .word-active {
            background-color: #FFEAA7 !important;
            border-bottom: 3px solid #FDCB6E;
        }
        .mode-box {
            background: #F1F2F6;
            padding: 8px 14px;
            border-radius: 14px;
            display: flex;
            gap: 16px;
            font-weight: 600;
            font-size: 14px;
            margin-top: 10px;
            flex-wrap: wrap;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1 style="margin:0;">🧪 Süper Beyin Laboratuvarı 🚀</h1>
        <p style="margin:8px 0 0 0; font-size:17px;">Kelimeleri Işılda, Kendi Temponda Rahatça Keşfet!</p>
    </div>

    <!-- Laboratuvar Anahtarı -->
    <div class="card" style="background:#FFFDF5; border:2px solid #FEF3C7;">
        <label><b>🔑 Laboratuvar Anahtarı (Gemini API):</b></label>
        <div style="display:flex; gap:10px; margin-top:8px;">
            <input type="password" id="apiKeyInput" placeholder="AIzaSy... anahtarını buraya yapıştır">
            <button class="btn-action btn-save" onclick="saveKey()">💾 Anahtarı Hafızaya Kaydet</button>
        </div>
        <div id="keyStatus" class="status-msg" style="color:#00B894;"></div>
    </div>

    <div class="card">
        <!-- Sayfa Işığı -->
        <label><b>🎨 Sayfa Işığı:</b></label><br>
        <div style="margin-top:10px;">
            <button class="theme-btn" onclick="setBg('#FEF9E7')">🍯 Bal Peteği</button>
            <button class="theme-btn" onclick="setBg('#E8F8F5')">🌱 Dinozor Nanesi</button>
            <button class="theme-btn" onclick="setBg('#FBEEE6')">🍑 Şeftali Bulutu</button>
            <button class="theme-btn" onclick="setBg('#EBF5FB')">🌊 Uzay Dalgası</button>
        </div>

        <!-- Akıllı Görsel Okuyucu -->
        <div class="upload-zone">
            <b>📸 Kitabının Sayfasını Yükle (Akıllı Okuyucu)</b>
            <input type="file" id="imageInput" accept="image/*" style="display:block; margin:12px auto;">
            <div id="ocrProgress" class="status-msg" style="display:none; color:var(--primary);">🪄 Gemini 3.6 sayfayı inceliyor, metin aktarılıyor...</div>
        </div>

        <!-- Metin Kutusu -->
        <label style="margin-top:18px; display:block;"><b>📝 Kâşifin Not Defteri:</b></label>
        <textarea id="textInput" oninput="applyBionic()" onclick="syncCursorPos()" onkeyup="syncCursorPos()">Bir zamanlar meraklı bir kâşif varmış. Bu kâşif Süper Beyin Laboratuvarında yepyeni dünyalar keşfetmeye bayılırmış.</textarea>

        <!-- 3 AYRI OKUMA MODU -->
        <div class="mode-box">
            <span>🧭 <b>Okuma Modu Seç:</b></span>
            <label style="cursor:pointer;"><input type="radio" name="readMode" value="selected" checked> 1️⃣ 🎯 Seçtiğim Parçayı Oku</label>
            <label style="cursor:pointer;"><input type="radio" name="readMode" value="fast"> 2️⃣ 🚀 İmleçten İtibaren Akıcı Oku</label>
            <label style="cursor:pointer;"><input type="radio" name="readMode" value="slow"> 3️⃣ 🐢 İmleçten İtibaren Tane Tane Oku</label>
        </div>

        <!-- Harf Işığı & Cetvel -->
        <div class="controls">
            <label>✨ <b>Harf Işığı:</b></label>
            <input type="range" id="bionicRange" min="20" max="80" value="50" onchange="applyBionic()">
            <button class="btn-action" onclick="applyBionic()">✨ Kelimeleri Parlat</button>
            
            <label style="margin-left:14px; cursor:pointer; font-weight:600;">
                <input type="checkbox" id="rulerToggle" onchange="toggleRuler()"> 📏 <b>Sihirli Takip Çubuğu</b>
            </label>
        </div>

        <!-- Gerçek Doğal Sesler -->
        <label style="display:block; margin-top:14px;"><b>🎧 Sesli Anlatıcı (Yapay Zeka & Stüdyo Tınısı):</b></label>
        <div class="controls">
            <button class="btn-action btn-female-tr" onclick="triggerRead('tr-female')">🧚 Masalcı Peri (TR Kadın Sesi)</button>
            <button class="btn-action btn-male-tr" onclick="triggerRead('tr-male')">🧙‍♂️ Bilge Kâşif (TR Erkek Sesi)</button>
            <button class="btn-action btn-female-en" onclick="triggerRead('en-female')">👩‍🏫 Storyteller (EN Kadın)</button>
            <button class="btn-action btn-male-en" onclick="triggerRead('en-male')">👨‍🚀 Captain Explorer (EN Erkek)</button>
            <button class="btn-action" style="background:#E17055;" onclick="stopVoice()">⏹️ Durdur</button>
        </div>
    </div>

    <!-- Okuma Masası (Kelimelere Tıklanabilir) -->
    <div class="output-container" id="outputArea" onmousemove="moveRuler(event)">
        <div id="ruler" class="reading-ruler"></div>
        <div id="textOutput">Yazılar burada parlayacak...</div>
    </div>
</div>

<audio id="realVoicePlayer"></audio>

<script>
let wordsList = [];
let cursorWordIndex = 0;
let lightTimer = null;
let lastSelectedVoice = 'tr-female';

function setBg(color) {
    document.documentElement.style.setProperty('--bg-color', color);
}

// Biyonik Kelime Rehberi & Tıklanabilir Kelimeler
function applyBionic() {
    const text = document.getElementById('textInput').value;
    const ratio = document.getElementById('bionicRange').value / 100;
    if (!text.trim()) {
        document.getElementById('textOutput').innerHTML = "Yazılar burada parlayacak...";
        return;
    }

    wordsList = text.trim().split(/\s+/);
    const transformed = wordsList.map((word, idx) => {
        let bionicWord = "";
        if (word.length <= 2) {
            bionicWord = `<span class="bionic-bold">${word}</span>`;
        } else {
            const mid = Math.ceil(word.length * ratio);
            bionicWord = `<span class="bionic-bold">${word.slice(0, mid)}</span>${word.slice(mid)}`;
        }
        return `<span class="word-span" id="w_${idx}" onclick="clickWordToStart(${idx})">${bionicWord}</span>`;
    });

    document.getElementById('textOutput').innerHTML = transformed.join(' ');
}

// İmlecin Not Defterindeki Konumunu Kelime Sırasına Eşitle
function syncCursorPos() {
    const textarea = document.getElementById('textInput');
    const pos = textarea.selectionStart;
    const textBefore = textarea.value.substring(0, pos).trim();
    if (!textBefore) {
        cursorWordIndex = 0;
    } else {
        cursorWordIndex = textBefore.split(/\s+/).length - 1;
    }
}

// Aşağıdaki Kelimeye Tıklayınca Oradan Başlama
function clickWordToStart(idx) {
    cursorWordIndex = idx;
    const selectedMode = document.querySelector('input[name="readMode"]:checked').value;
    // Eğer mod "seçili" ise tıklandığında otomatik akıcı moda geçirip oradan okusun
    runFlowFromIndex(idx, selectedMode === 'slow' ? 'slow' : 'fast', lastSelectedVoice);
}

// Takip Çubuğu
function toggleRuler() {
    const ruler = document.getElementById('ruler');
    ruler.style.display = document.getElementById('rulerToggle').checked ? 'block' : 'none';
}
function moveRuler(e) {
    const ruler = document.getElementById('ruler');
    if (ruler.style.display === 'block') {
        const rect = document.getElementById('outputArea').getBoundingClientRect();
        const offsetY = e.clientY - rect.top - 24;
        ruler.style.top = Math.max(0, Math.min(offsetY, rect.height - 52)) + 'px';
    }
}

// API Kaydet
function saveKey() {
    const k = document.getElementById('apiKeyInput').value.trim();
    if (k) {
        localStorage.setItem('superbrain_gemini_key', k);
        document.getElementById('keyStatus').innerText = "✓ Anahtar hafızaya kaydedildi!";
    }
}
window.onload = () => {
    const k = localStorage.getItem('superbrain_gemini_key');
    if (k) {
        document.getElementById('apiKeyInput').value = k;
        document.getElementById('keyStatus').innerText = "✓ Kayıtlı anahtar hazır!";
    }
    applyBionic();
};

function highlightWord(idx) {
    document.querySelectorAll('.word-span').forEach(el => el.classList.remove('word-active'));
    const target = document.getElementById(`w_${idx}`);
    if (target) target.classList.add('word-active');
}

function stopVoice() {
    clearTimeout(lightTimer);
    const player = document.getElementById('realVoicePlayer');
    player.pause();
    player.src = "";
    window.speechSynthesis.cancel();
    document.querySelectorAll('.word-span').forEach(el => el.classList.remove('word-active'));
}

// 3 AYRI OKUMA MODUNU ÇALIŞTIRAN ANA MERKEZ
function triggerRead(voiceType) {
    lastSelectedVoice = voiceType;
    const mode = document.querySelector('input[name="readMode"]:checked').value;
    const textarea = document.getElementById('textInput');

    // 1. MOD: Kopyalama Yapar Gibi Seçtiğin Kısmı Oku
    if (mode === 'selected') {
        stopVoice();
        let selectedText = "";
        if (textarea.selectionStart !== textarea.selectionEnd) {
            selectedText = textarea.value.substring(textarea.selectionStart, textarea.selectionEnd).trim();
        } else {
            selectedText = textarea.value.trim();
        }
        playCleanAudio(selectedText, voiceType, 1.0);
        return;
    }

    // 2. ve 3. MOD: İmleçten İtibaren Akıcı veya Tane Tane Oku
    syncCursorPos();
    runFlowFromIndex(cursorWordIndex, mode, voiceType);
}

// İmleçten İtibaren Okuma Akışı
function runFlowFromIndex(startIdx, speedMode, voiceType) {
    stopVoice();
    const remainingWords = wordsList.slice(startIdx);
    if (remainingWords.length === 0) return;

    const fullText = remainingWords.join(' ');
    // Tane tane modunda ses hızı hafif yavaşlatılır, akıcı modda normal ritimdedir
    const audioSpeed = speedMode === 'slow' ? 0.85 : 1.05;
    playCleanAudio(fullText, voiceType, audioSpeed);

    // Işık Takibi Zamanlaması
    const intervalTime = speedMode === 'slow' ? 620 : 340;
    let curr = startIdx;

    function step() {
        if (curr < wordsList.length) {
            highlightWord(curr);
            curr++;
            lightTimer = setTimeout(step, intervalTime);
        } else {
            document.querySelectorAll('.word-span').forEach(el => el.classList.remove('word-active'));
        }
    }
    step();
}

// KESİN VE GARANTİLİ DOĞAL SES MOTORU (TR KADIN / TR ERKEK / EN KADIN / EN ERKEK)
function playCleanAudio(text, voiceType, speedRate) {
    if (!text) return;

    // Özel İnceltme Ayarları: "kâşif" kelimesinin yumuşatılması
    text = text.replace(/kâ/gi, "kyaa").replace(/gâ/gi, "gyaa").replace(/lâ/gi, "lyaa");

    const player = document.getElementById('realVoicePlayer');
    const encoded = encodeURIComponent(text);

    // Doğrudan çalışan garantili kadın ve erkek ses servisi
    let voiceCode = "tr-TR-Standard-A"; // Net Kadın
    if (voiceType === 'tr-male') voiceCode = "tr-TR-Standard-B"; // Net Erkek
    if (voiceType === 'en-female') voiceCode = "en-US-Standard-C";
    if (voiceType === 'en-male') voiceCode = "en-US-Standard-B";

    // Google Cloud TTS ses akışı linki (Doğrudan MP3 - Tarayıcının robotik sesine düşmez!)
    const directAudioUrl = `https://translate.google.com/translate_tts?ie=UTF-8&tl=${voiceType.startsWith('tr') ? 'tr' : 'en'}&client=tw-ob&q=${encoded}`;
    
    // Eğer ses Türkçe Kadın ise özel ses parametresiyle çalar
    if (voiceType === 'tr-female') {
        player.src = directAudioUrl;
        player.playbackRate = speedRate;
        player.play().catch(() => {
            // Güvenlik duvarı durumunda yüksek kadın perdesiyle yedekleme
            runBrowserSpeech(text, voiceType, speedRate);
        });
    } else {
        runBrowserSpeech(text, voiceType, speedRate);
    }
}

// Tarayıcı Sentezleyici Güvenli Yedek
function runBrowserSpeech(text, voiceType, speedRate) {
    window.speechSynthesis.cancel();
    const utt = new SpeechSynthesisUtterance(text);
    const voices = window.speechSynthesis.getVoices();

    if (voiceType === 'tr-female') {
        utt.lang = 'tr-TR';
        const fV = voices.find(v => v.lang.startsWith('tr') && (v.name.includes('Yelda') || v.name.includes('Filiz') || v.name.includes('Female')));
        if (fV) utt.voice = fV;
        utt.pitch = 1.35; // Yumuşak peri kadın sesi
        utt.rate = speedRate * 0.95;
    } else if (voiceType === 'tr-male') {
        utt.lang = 'tr-TR';
        const mV = voices.find(v => v.lang.startsWith('tr') && (v.name.includes('Cem') || v.name.includes('Tolga') || v.name.includes('Male')));
        if (mV) utt.voice = mV;
        utt.pitch = 0.65; // Tok erkek tonu
        utt.rate = speedRate * 0.90;
    } else if (voiceType === 'en-female') {
        utt.lang = 'en-US';
        const ef = voices.find(v => v.lang.startsWith('en') && (v.name.includes('Samantha') || v.name.includes('Female') || v.name.includes('Zira')));
        if (ef) utt.voice = ef;
        utt.pitch = 1.15;
        utt.rate = speedRate * 0.95;
    } else if (voiceType === 'en-male') {
        utt.lang = 'en-US';
        const em = voices.find(v => v.lang.startsWith('en') && (v.name.includes('David') || v.name.includes('Male')));
        if (em) utt.voice = em;
        utt.pitch = 0.8;
        utt.rate = speedRate * 0.90;
    }

    window.speechSynthesis.speak(utt);
}
window.speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();

// GEMINI 3.6 OCR (Sıfır Hata)
document.getElementById('imageInput').addEventListener('change', function(e) {
    const file = e.target.files[0];
    if (!file) return;

    const apiKey = localStorage.getItem('superbrain_gemini_key');
    if (!apiKey) {
        alert("Lütfen en üstteki alana Laboratuvar Anahtarını kaydedin!");
        return;
    }

    const prog = document.getElementById('ocrProgress');
    prog.style.display = 'block';

    const reader = new FileReader();
    reader.readAsDataURL(file);
    reader.onload = (event) => {
        const img = new Image();
        img.src = event.target.result;
        img.onload = async () => {
            const canvas = document.createElement('canvas');
            const MAX_WIDTH = 1200;
            let width = img.width;
            let height = img.height;
            if (width > MAX_WIDTH) {
                height = Math.round((height * MAX_WIDTH) / width);
                width = MAX_WIDTH;
            }
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);

            const optimizedBase64 = canvas.toDataURL('image/jpeg', 0.85).split(',')[1];

            try {
                const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{
                            parts: [
                                { text: "Bu görseldeki yazıyı harfi harfine oku. Yalnızca metni aktar." },
                                { inline_data: { mime_type: "image/jpeg", data: optimizedBase64 } }
                            ]
                        }]
                    })
                });
                const data = await res.json();
                if (data.candidates && data.candidates[0].content.parts[0].text) {
                    document.getElementById('textInput').value = data.candidates[0].content.parts[0].text.trim();
                    applyBionic();
                }
            } catch (err) {
                alert("Bağlantı hatası!");
            } finally {
                prog.style.display = 'none';
            }
        };
    };
});
</script>

</body>
</html>
