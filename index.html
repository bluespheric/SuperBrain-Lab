<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Süper Beyin Laboratuvarı</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #F4EFE6;       /* Genel yumuşak bej */
            --card-bg: #FAF6EF;      /* Kartlar için sıcak krem bej */
            --text-bg: #F5EFE1;      /* Metin kutusu beji */
            --bionic-color: #1E3A8A; /* Disleksi koyu mavi vurgusu */
            --primary: #5B4BC4;
            --jigsaw: #0984E3;
            --dual: #00B894;
        }
        body {
            font-family: 'Fredoka', sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 24px;
            color: #2D3748;
            transition: background-color 0.3s ease;
        }
        .container { max-width: 900px; margin: 0 auto; }
        .header {
            background: linear-gradient(135deg, #1E3A8A, #5B4BC4);
            color: white;
            padding: 22px;
            border-radius: 24px;
            text-align: center;
            box-shadow: 0 6px 20px rgba(30, 58, 138, 0.15);
            margin-bottom: 20px;
        }
        .card {
            background: var(--card-bg);
            padding: 22px;
            border-radius: 20px;
            box-shadow: 0 4px 14px rgba(0,0,0,0.04);
            margin-bottom: 18px;
            border: 1px solid #EADBCA;
        }
        .theme-btn {
            padding: 8px 16px;
            border-radius: 12px;
            border: 2px solid #E2D7C5;
            cursor: pointer;
            font-weight: 600;
            background: #FFFDF9;
            margin-right: 6px;
            margin-bottom: 6px;
            font-family: inherit;
        }
        textarea, input[type="password"] {
            width: 100%;
            border-radius: 16px;
            border: 2px solid #E2D7C5;
            padding: 16px;
            font-size: 19px;
            font-family: inherit;
            box-sizing: border-box;
            outline: none;
            margin-top: 8px;
            background-color: var(--text-bg);
            color: #2D3748;
            line-height: 1.6;
        }
        textarea { height: 120px; resize: vertical; }
        .controls {
            display: flex; gap: 10px; align-items: center; margin: 14px 0; flex-wrap: wrap;
        }
        .btn-action {
            color: white; border: none;
            padding: 12px 18px; border-radius: 14px; font-size: 15px; font-weight: bold;
            cursor: pointer; font-family: inherit;
            transition: transform 0.15s;
        }
        .btn-action:hover { transform: scale(1.02); }
        .btn-save { background: #00B894; }
        .btn-bionic { background: var(--primary); }
        .btn-jigsaw { background: #0984E3; }
        .btn-dual { background: #00B894; }

        /* Jigsaw Kutuları */
        .jigsaw-box {
            display: none;
            background: #EBF3FA;
            border: 2px solid #BFDBFE;
            border-radius: 16px;
            padding: 18px;
            margin-top: 16px;
        }
        .jigsaw-title {
            font-size: 18px;
            font-weight: bold;
            color: #1E3A8A;
            margin-bottom: 8px;
        }
        .jigsaw-item {
            background: #FFFFFF;
            padding: 10px 14px;
            border-radius: 12px;
            margin-top: 8px;
            font-size: 16px;
            border-left: 4px solid #0984E3;
        }

        /* Dual Coding Görsel Kartları */
        .dual-box {
            display: none;
            margin-top: 16px;
        }
        .dual-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 14px;
            margin-top: 10px;
        }
        .dual-card {
            background: #FFFFFF;
            border-radius: 16px;
            overflow: hidden;
            border: 2px solid #D1FAE5;
            box-shadow: 0 4px 10px rgba(0,0,0,0.03);
            text-align: center;
        }
        .dual-card img {
            width: 100%;
            height: 170px;
            object-fit: cover;
            background: #F0FDF4;
        }
        .dual-card-caption {
            padding: 10px;
            font-weight: 600;
            font-size: 14px;
            color: #065F46;
        }

        .output-container {
            position: relative; background-color: var(--text-bg); padding: 26px;
            border-radius: 20px; font-size: 25px; line-height: 2.3;
            border: 3px dashed #D3C5B4; min-height: 110px; margin-top: 18px;
            user-select: text; color: #2D3748;
        }
        .reading-ruler {
            position: absolute; left: 0; right: 0; height: 56px;
            background: rgba(253, 203, 110, 0.35); border-top: 2px solid #FDCB6E;
            border-bottom: 2px solid #FDCB6E; pointer-events: none; display: none;
        }
        .bionic-bold { color: var(--bionic-color); font-weight: 800; }
        .status-msg { margin-top: 8px; font-weight: 600; font-size: 14px; }
        .upload-zone {
            background: #EFE8DA; border: 2px dashed #C8BCAC; padding: 16px;
            border-radius: 16px; margin-top: 12px; text-align: center;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1 style="margin:0;">🧪 Süper Beyin Laboratuvarı 🚀</h1>
        <p style="margin:6px 0 0 0; font-size:16px;">Gözü Yormayan, Bilişsel Okuma & Görsel Zihin Alanı</p>
    </div>

    <!-- Laboratuvar Anahtarı -->
    <div class="card" style="background:#F6EEDF;">
        <label><b>🔑 Laboratuvar Anahtarı (Gemini API):</b></label>
        <div style="display:flex; gap:10px; margin-top:8px;">
            <input type="password" id="apiKeyInput" placeholder="AIzaSy... anahtarını yapıştır">
            <button class="btn-action btn-save" onclick="saveKey()">💾 Kaydet</button>
        </div>
        <div id="keyStatus" class="status-msg" style="color:#00B894;"></div>
    </div>

    <div class="card">
        <!-- Sayfa Işığı -->
        <label><b>🎨 Sayfa Işığı (Sıcak Zeminler):</b></label><br>
        <div style="margin-top:8px;">
            <button class="theme-btn" onclick="setBg('#F4EFE6', '#FAF6EF', '#F5EFE1')">🍯 Bal Beji (Varsayılan)</button>
            <button class="theme-btn" onclick="setBg('#EAEFE8', '#F2F7F0', '#E5ECE3')">🌱 Nane Kreması</button>
            <button class="theme-btn" onclick="setBg('#F6ECE6', '#FAF2EC', '#F4E7E0')">🍑 Şeftali Beji</button>
        </div>

        <!-- Akıllı Görsel Okuyucu (Türkçe + İngilizce Hızlı Motor) -->
        <div class="upload-zone">
            <b>📸 Kitap Sayfası Yükle (TR & EN Hızlı Okuyucu)</b>
            <input type="file" id="imageInput" accept="image/*" style="display:block; margin:8px auto;">
            <div id="aiProgress" class="status-msg" style="display:none; color:var(--bionic-color);">🪄 Harfler hızla toplanıyor...</div>
        </div>

        <!-- Metin Kutusu -->
        <label style="margin-top:16px; display:block;"><b>📝 Kâşifin Not Defteri:</b></label>
        <textarea id="textInput" oninput="applyBionic()">Astronauts live in the space station to explore the universe. They float in microgravity and eat special space food. Every day they do experiments and exercise to stay strong.</textarea>

        <!-- Biyonik Ayarı -->
        <div class="controls">
            <label>✨ <b>Harf Işığı:</b></label>
            <input type="range" id="bionicRange" min="20" max="80" value="50" onchange="applyBionic()">
            <button class="btn-action btn-bionic" onclick="applyBionic()">✨ Kelimeleri Parlat</button>
            
            <label style="margin-left:14px; cursor:pointer; font-weight:600;">
                <input type="checkbox" id="rulerToggle" onchange="toggleRuler()"> 📏 <b>Sihirli Takip Çubuğu</b>
            </label>
        </div>

        <!-- Doğrudan Çocuk Odaklı Butonlar -->
        <div class="controls" style="border-top:1px solid #E2D7C5; padding-top:14px;">
            <button class="btn-action btn-jigsaw" onclick="runJigsaw()">🧩 Jigsaw (Büyük Resim & 3 Parça)</button>
            <button class="btn-action btn-dual" onclick="runDualCoding()">🎨 Dual Coding (Yapay Zekâ Resimleri)</button>
            <span id="moduleLoading" style="display:none; font-weight:bold; color:var(--primary);">⏳ Hazırlanıyor...</span>
        </div>
    </div>

    <!-- Jigsaw Paneli (Sıfır Laf Kalabalığı) -->
    <div id="jigsawBox" class="jigsaw-box">
        <div class="jigsaw-title">🖼️ Büyük Resim (Ana Fikir)</div>
        <div id="jigsawCover" style="font-size:18px; font-weight:600; color:#1E3A8A; margin-bottom:12px;"></div>
        
        <div class="jigsaw-title" style="margin-top:14px;">🧩 Kenar Parçaları</div>
        <div id="jigsawEdges"></div>
    </div>

    <!-- Dual Coding Paneli (Sadece AI Resimleri) -->
    <div id="dualBox" class="dual-box">
        <div style="font-size:18px; font-weight:bold; color:#065F46; margin-bottom:8px;">🎨 Zihin Sahneleri (Yapay Zekâ Resimleri)</div>
        <div class="dual-grid" id="dualGrid"></div>
    </div>

    <!-- Okuma Masası -->
    <div class="output-container" id="outputArea" onmousemove="moveRuler(event)">
        <div id="ruler" class="reading-ruler"></div>
        <div id="textOutput">Yazılar burada parlayacak...</div>
    </div>
</div>

<script>
function setBg(bodyColor, cardColor, textColor) {
    document.documentElement.style.setProperty('--bg-color', bodyColor);
    document.documentElement.style.setProperty('--card-bg', cardColor);
    document.documentElement.style.setProperty('--text-bg', textColor);
}

function applyBionic() {
    const text = document.getElementById('textInput').value;
    const ratio = document.getElementById('bionicRange').value / 100;
    if (!text.trim()) {
        document.getElementById('textOutput').innerHTML = "Yazılar burada parlayacak...";
        return;
    }

    const words = text.split(/\s+/);
    const transformed = words.map(word => {
        if (word.length <= 2) return `<span class="bionic-bold">${word}</span>`;
        const mid = Math.ceil(word.length * ratio);
        return `<span class="bionic-bold">${word.slice(0, mid)}</span>${word.slice(mid)}`;
    });
    document.getElementById('textOutput').innerHTML = transformed.join(' ');
}

function toggleRuler() {
    document.getElementById('ruler').style.display = document.getElementById('rulerToggle').checked ? 'block' : 'none';
}
function moveRuler(e) {
    const ruler = document.getElementById('ruler');
    if (ruler.style.display === 'block') {
        const rect = document.getElementById('outputArea').getBoundingClientRect();
        const offsetY = e.clientY - rect.top - 28;
        ruler.style.top = Math.max(0, Math.min(offsetY, rect.height - 56)) + 'px';
    }
}

function saveKey() {
    const k = document.getElementById('apiKeyInput').value.trim();
    if (k) {
        localStorage.setItem('superbrain_gemini_key', k);
        document.getElementById('keyStatus').innerText = "✓ Anahtar hafızaya kaydedildi!";
    }
}
window.onload = () => {
    const k = localStorage.getItem('superbrain_gemini_key');
    if (k) {
        document.getElementById('apiKeyInput').value = k;
        document.getElementById('keyStatus').innerText = "✓ Kayıtlı anahtar hazır!";
    }
    applyBionic();
};

// MERKEZİ HIZLI GEMINI CORE
async function askGemini(promptText, base64Image = null) {
    const apiKey = localStorage.getItem('superbrain_gemini_key');
    if (!apiKey) throw new Error("Lütfen önce Laboratuvar Anahtarını kaydedin!");

    const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent?key=${apiKey}`;
    let parts = [{ text: promptText }];
    if (base64Image) {
        parts.push({ inline_data: { mime_type: "image/jpeg", data: base64Image } });
    }

    const res = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ contents: [{ parts: parts }] })
    });
    const data = await res.json();
    if (data.error) throw new Error(data.error.message);
    return data.candidates[0].content.parts[0].text.trim();
}

// 1. JIGSAW: SADECE ÇOCUK DİLİ, TEORİ VE SELAMLAMA YASAK
async function runJigsaw() {
    const text = document.getElementById('textInput').value.trim();
    if (!text) return;

    const loader = document.getElementById('moduleLoading');
    const box = document.getElementById('jigsawBox');
    const cover = document.getElementById('jigsawCover');
    const edges = document.getElementById('jigsawEdges');

    loader.style.display = 'inline';
    box.style.display = 'none';

    // JSON formatında alarak gereksiz tüm sohbeti kesiyoruz
    const prompt = `Metin: "${text}"
Bu metni okuyan bir çocuk için doğrudan Jigsaw çıktısı ver. Asla selamlama, giriş, önsöz veya pedagojik açıklama yazma.
Yalnızca şu JSON formatında cevap ver:
{
  "buyuk_resim": "Metnin ana fikrini anlatan tek ve çok sade bir cümle",
  "kenar_parcalari": [
    "1. Adım veya olay (kısa ve net)",
    "2. Adım veya olay (kısa ve net)",
    "3. Adım veya olay (kısa ve net)"
  ]
}`;

    try {
        const reply = await askGemini(prompt);
        // JSON ayıklama
        const cleaned = reply.replace(/```json|```/g, '').trim();
        const data = JSON.parse(cleaned);

        cover.innerText = data.buyuk_resim;
        edges.innerHTML = data.kenar_parcalari.map(item => `<div class="jigsaw-item">🔹 ${item}</div>`).join('');
        box.style.display = 'block';
    } catch (e) {
        alert("Jigsaw hazırlanırken bir sorun oluştu, tekrar dene.");
    } finally {
        loader.style.display = 'none';
    }
}

// 2. DUAL CODING: YAZI YOK, DOĞRUDAN AI OLUŞTURULMUŞ ÇOCUK DOSTU İLLÜSTRASYONLAR
async function runDualCoding() {
    const text = document.getElementById('textInput').value.trim();
    if (!text) return;

    const loader = document.getElementById('moduleLoading');
    const box = document.getElementById('dualBox');
    const grid = document.getElementById('dualGrid');

    loader.style.display = 'inline';
    box.style.display = 'none';
    grid.innerHTML = "";

    const prompt = `Metin: "${text}"
Bu metindeki sahneler için 3 adet minimalist, sevimli, çocuk kitabı tarzı İngilizce görsel prompt oluştur.
Asla selamlama veya açıklama yazma. Yalnızca şu JSON formatında cevap ver:
{
  "scenes": [
    {"caption": "Türkçe çok kısa sahne başlığı (en fazla 3 kelime)", "image_prompt": "simple cute children book illustration of ... on plain background"},
    {"caption": "Türkçe çok kısa sahne başlığı (en fazla 3 kelime)", "image_prompt": "simple cute children book illustration of ... on plain background"},
    {"caption": "Türkçe çok kısa sahne başlığı (en fazla 3 kelime)", "image_prompt": "simple cute children book illustration of ... on plain background"}
  ]
}`;

    try {
        const reply = await askGemini(prompt);
        const cleaned = reply.replace(/```json|```/g, '').trim();
        const data = JSON.parse(cleaned);

        data.scenes.forEach(scene => {
            const card = document.createElement('div');
            card.className = 'dual-card';
            // Pollinations AI: Hızlı, anahtarsız ve doğrudan promptu çizip getiren görsel motoru
            const seed = Math.floor(Math.random() * 1000);
            const imgUrl = `https://image.pollinations.ai/prompt/${encodeURIComponent(scene.image_prompt)}?width=400&height=300&nologo=true&seed=${seed}`;

            card.innerHTML = `
                <img src="${imgUrl}" alt="${scene.caption}" loading="lazy">
                <div class="dual-card-caption">✨ ${scene.caption}</div>
            `;
            grid.appendChild(card);
        });

        box.style.display = 'block';
    } catch (e) {
        alert("Görseller hazırlanırken bir sorun oluştu.");
    } finally {
        loader.style.display = 'none';
    }
}

// 3. HIZLI & ÇİFT DİLLİ OCR (TR & EN)
document.getElementById('imageInput').addEventListener('change', function(e) {
    const file = e.target.files[0];
    if (!file) return;

    const prog = document.getElementById('aiProgress');
    prog.style.display = 'block';

    const reader = new FileReader();
    reader.readAsDataURL(file);
    reader.onload = (event) => {
        const img = new Image();
        img.src = event.target.result;
        img.onload = async () => {
            const canvas = document.createElement('canvas');
            // Hız için optimize boyut: 1000px
            const MAX_WIDTH = 1000;
            let width = img.width, height = img.height;
            if (width > MAX_WIDTH) { height = Math.round(height * MAX_WIDTH / width); width = MAX_WIDTH; }
            canvas.width = width; canvas.height = height;
            canvas.getContext('2d').drawImage(img, 0, 0, width, height);

            const optimizedBase64 = canvas.toDataURL('image/jpeg', 0.8).split(',')[1];

            try {
                // Hem Türkçe hem İngilizceyi harfi harfine okur
                const prompt = "Read and transcribe all the written text in this image verbatim. It can be in Turkish or English. Output ONLY the raw extracted text. Do not add any greeting, commentary, or explanation.";
                const resultText = await askGemini(prompt, optimizedBase64);
                document.getElementById('textInput').value = resultText;
                applyBionic();
            } catch (err) {
                alert("Okuma hatası: " + err.message);
            } finally {
                prog.style.display = 'none';
                document.getElementById('imageInput').value = ""; 
            }
        };
    };
});
</script>

</body>
</html>
