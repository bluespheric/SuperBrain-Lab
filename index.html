<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🧪 Süper Beyin Laboratuvarı 🚀</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/tesseract.js@v4.0.2/dist/tesseract.min.js"></script>
    <style>
        :root {
            --bg-color: #FEF9E7;
            --primary: #6C5CE7;
            --accent: #FD79A8;
            --mint: #00B894;
        }
        body {
            font-family: 'Fredoka', sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 20px;
            color: #2D3748;
            transition: background-color 0.3s;
        }
        .container {
            max-width: 850px;
            margin: 0 auto;
        }
        .header {
            background: linear-gradient(135deg, #6C5CE7, #a29bfe);
            color: white;
            padding: 22px;
            border-radius: 24px;
            text-align: center;
            box-shadow: 0 8px 20px rgba(108, 92, 231, 0.2);
            margin-bottom: 20px;
        }
        .card {
            background: #FFFFFF;
            padding: 22px;
            border-radius: 20px;
            box-shadow: 0 4px 14px rgba(0,0,0,0.06);
            margin-bottom: 20px;
        }
        .theme-btn {
            padding: 8px 16px;
            border-radius: 12px;
            border: 2px solid #E2E8F0;
            cursor: pointer;
            font-weight: 600;
            background: white;
            margin-right: 8px;
            margin-bottom: 8px;
        }
        textarea {
            width: 100%;
            height: 120px;
            border-radius: 14px;
            border: 2px solid #E2E8F0;
            padding: 12px;
            font-size: 17px;
            font-family: inherit;
            box-sizing: border-box;
            outline: none;
            margin-top: 10px;
        }
        .controls {
            display: flex;
            gap: 12px;
            align-items: center;
            margin: 15px 0;
            flex-wrap: wrap;
        }
        .btn-action {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 16px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(108, 92, 231, 0.25);
            transition: transform 0.2s;
        }
        .btn-action:hover {
            transform: scale(1.04);
        }
        .btn-female {
            background: linear-gradient(135deg, #FD79A8, #E84393);
        }
        .btn-male {
            background: linear-gradient(135deg, #0984E3, #74B9FF);
        }
        .btn-en {
            background: linear-gradient(135deg, #00B894, #55EFC4);
            color: #2D3748;
        }
        .output-box {
            background-color: #FFFFFF;
            padding: 25px;
            border-radius: 20px;
            font-size: 23px;
            line-height: 2.3;
            border: 3px dashed var(--primary);
            min-height: 100px;
            margin-top: 15px;
        }
        .bionic-bold {
            color: var(--primary);
            font-weight: 800;
        }
        .ocr-zone {
            background: #F8F9FA;
            border: 2px dashed #A0AEC0;
            padding: 18px;
            border-radius: 16px;
            margin-top: 12px;
            text-align: center;
        }
        #ocrProgress {
            font-weight: bold;
            color: var(--primary);
            margin-top: 10px;
            display: none;
        }
        canvas {
            display: none;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1 style="margin:0;">🧪 Süper Beyin Laboratuvarı 🚀</h1>
        <p style="margin:6px 0 0 0; font-size:17px;">Gizli Harfleri Yakala, Masalını Canlandır!</p>
    </div>

    <div class="card">
        <label><b>🎨 Büyülü Zemin Rengi:</b></label><br>
        <div style="margin-top:8px;">
            <button class="theme-btn" onclick="setBg('#FEF9E7')">🍯 Bal Peteği</button>
            <button class="theme-btn" onclick="setBg('#E8F8F5')">🌱 Dinozor Nanesi</button>
            <button class="theme-btn" onclick="setBg('#FBEEE6')">🍑 Şeftali Bulutu</button>
            <button class="theme-btn" onclick="setBg('#EBF5FB')">🌊 Uzay Dalgası</button>
        </div>

        <!-- Akıllı Ön Filtreli OCR -->
        <div class="ocr-zone">
            <b>📸 Kitabının Sayfasını Yakala & Çöz</b>
            <input type="file" id="imageInput" accept="image/*" style="display:block; margin:10px auto;">
            <canvas id="filterCanvas"></canvas>
            <img id="imagePreview" style="max-width:200px; display:none; margin:10px auto; border-radius:8px;" alt="Önizleme">
            <div id="ocrProgress">🪄 Büyüteç harfleri netleştiriyor...</div>
        </div>

        <label style="margin-top:15px; display:block;"><b>📝 Kâşifin Not Defteri:</b></label>
        <textarea id="textInput">Bir zamanlar meraklı bir kâşif varmış. Bu kâşif Süper Beyin Laboratuvarında yepyeni dünyalar keşfetmeye bayılırmış.</textarea>

        <div class="controls">
            <label>⚡ <b>Odak Gücü:</b></label>
            <input type="range" id="bionicRange" min="20" max="80" value="50">
            <button class="btn-action" onclick="applyBionic()">✨ Kelimeleri Parlat</button>
            <button class="btn-action btn-female" onclick="speakVoice('female_tr')">🧚 Masalcı Peri Oku</button>
            <button class="btn-action btn-male" onclick="speakVoice('male_tr')">🧙‍♂️ Bilge Kâşif Oku</button>
            <button class="btn-action btn-en" onclick="speakVoice('en')">🇬🇧 Storyteller</button>
        </div>
    </div>

    <div class="output-box" id="outputArea">
        Kelimeler burada sihirli şekilde parlayacak...
    </div>
</div>

<script>
function setBg(color) {
    document.documentElement.style.setProperty('--bg-color', color);
}

// Biyonik Okuma
function applyBionic() {
    const text = document.getElementById('textInput').value;
    const ratio = document.getElementById('bionicRange').value / 100;
    if (!text.trim()) return;

    const words = text.split(/\s+/);
    const transformed = words.map(word => {
        if (word.length <= 2) {
            return `<span class="bionic-bold">${word}</span>`;
        }
        const mid = Math.ceil(word.length * ratio);
        return `<span class="bionic-bold">${word.slice(0, mid)}</span>${word.slice(mid)}`;
    });

    document.getElementById('outputArea').innerHTML = transformed.join(' ');
}

// Gelişmiş Çoklu Seslendirici
function speakVoice(mode) {
    let text = document.getElementById('textInput').value;
    if (!text.trim()) return;

    // Fonetik akış: "kâşif" kelimesindeki yumuşak 'a' telaffuzunu doğal akıtma
    text = text.replace(/kâ/gi, "kyaa").replace(/gâ/gi, "gyaa").replace(/lâ/gi, "lyaa");

    window.speechSynthesis.cancel();
    const utterance = new SpeechSynthesisUtterance(text);
    const voices = window.speechSynthesis.getVoices();

    if (mode === 'female_tr') {
        utterance.lang = 'tr-TR';
        const femaleTr = voices.find(v => v.lang.startsWith('tr') && (v.name.includes('Yelda') || v.name.includes('Filiz') || v.name.includes('Female') || v.name.includes('Google Türkçe')));
        if (femaleTr) utterance.voice = femaleTr;
        utterance.pitch = 1.25; // Kadın / Peri frekansı
        utterance.rate = 0.93;
    } else if (mode === 'male_tr') {
        utterance.lang = 'tr-TR';
        const maleTr = voices.find(v => v.lang.startsWith('tr') && (v.name.includes('Tolga') || v.name.includes('Cem') || v.name.includes('Male')));
        if (maleTr) utterance.voice = maleTr;
        utterance.pitch = 0.85; // Tok / Bilge tonu
        utterance.rate = 0.90;
    } else if (mode === 'en') {
        utterance.lang = 'en-US';
        const engVoice = voices.find(v => v.lang.startsWith('en') && (v.name.includes('Samantha') || v.name.includes('Natural') || v.name.includes('Google US English')));
        if (engVoice) utterance.voice = engVoice;
        utterance.pitch = 1.05;
        utterance.rate = 0.92;
    }

    window.speechSynthesis.speak(utterance);
}
window.speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();

// OCR Ön İşleme (Kontrast ve Gri Tonlama ile Netleştirme)
document.getElementById('imageInput').addEventListener('change', function(e) {
    const file = e.target.files[0];
    if (!file) return;

    const prog = document.getElementById('ocrProgress');
    const preview = document.getElementById('imagePreview');
    const canvas = document.getElementById('filterCanvas');
    const ctx = canvas.getContext('2d');

    prog.style.display = 'block';
    prog.innerText = "🪄 Sayfa taranıyor... Fotoğraf netleştiriliyor.";

    const img = new Image();
    img.src = URL.createObjectURL(file);
    img.onload = () => {
        preview.src = img.src;
        preview.style.display = 'block';

        // Fotoğraftaki gölgeleri silip kontrastı açma
        canvas.width = img.width;
        canvas.height = img.height;
        ctx.drawImage(img, 0, 0);
        const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        const d = imgData.data;
        
        for (let i = 0; i < d.length; i += 4) {
            let avg = 0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2];
            // Yüksek kontrast eşiği
            let threshold = avg > 128 ? 255 : 0;
            d[i] = threshold;
            d[i + 1] = threshold;
            d[i + 2] = threshold;
        }
        ctx.putImageData(imgData, 0, 0);

        // Netleşen görseli Tesseract'a gönderme
        Tesseract.recognize(
            canvas.toDataURL(),
            'tur',
            {
                logger: m => {
                    if (m.status === 'recognizing text') {
                        prog.innerText = `🪄 Harfler yakalanıyor... %${Math.floor(m.progress * 100)}`;
                    }
                }
            }
        ).then(({ data: { text } }) => {
            prog.style.display = 'none';
            if (text && text.trim().length > 2) {
                // Karakter temizleme
                const cleaned = text.replace(/[\f\r]/g, '').trim();
                document.getElementById('textInput').value = cleaned;
                applyBionic();
            } else {
                alert("Harfler tam seçilemedi. Lütfen sayfayı daha düz ve ışıklı çekip dene!");
            }
        }).catch(err => {
            prog.style.display = 'none';
            alert("Okuma hatası: " + err);
        });
    };
});

applyBionic();
</script>

</body>
</html>
