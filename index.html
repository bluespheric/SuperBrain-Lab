<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Süper Beyin Laboratuvarı</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            /* Disleksi Dostu Renk Paleti */
            --bg-color: #F9F6EE; /* Genel açık krem/bej */
            --text-bg: #FDF4E3; /* Metin kutuları için sıcak bej */
            --bionic-color: #1E3A8A; /* Vurgulu harfler için Koyu Mavi */
            --primary: #6C5CE7;
            --accent: #FD79A8;
        }
        body {
            font-family: 'Fredoka', sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 24px;
            color: #2D3748;
            transition: background-color 0.3s ease;
        }
        .container {
            max-width: 880px;
            margin: 0 auto;
        }
        .header {
            background: linear-gradient(135deg, #1E3A8A, #6C5CE7);
            color: white;
            padding: 24px;
            border-radius: 24px;
            text-align: center;
            box-shadow: 0 8px 24px rgba(30, 58, 138, 0.2);
            margin-bottom: 24px;
        }
        .card {
            background: #FFFFFF;
            padding: 24px;
            border-radius: 20px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.05);
            margin-bottom: 20px;
        }
        .theme-btn {
            padding: 10px 18px;
            border-radius: 14px;
            border: 2px solid #E2E8F0;
            cursor: pointer;
            font-weight: 600;
            background: white;
            margin-right: 8px;
            margin-bottom: 8px;
            font-family: inherit;
            transition: all 0.2s;
        }
        .theme-btn:hover {
            border-color: var(--primary);
            transform: translateY(-2px);
        }
        textarea, input[type="password"] {
            width: 100%;
            border-radius: 16px;
            border: 2px solid #E2E8F0;
            padding: 18px;
            font-size: 19px;
            font-family: inherit;
            box-sizing: border-box;
            outline: none;
            margin-top: 8px;
            background-color: var(--text-bg);
            color: #2D3748;
            line-height: 1.6;
        }
        textarea { height: 140px; resize: vertical; }
        .controls {
            display: flex;
            gap: 12px;
            align-items: center;
            margin: 16px 0;
            flex-wrap: wrap;
        }
        .btn-action {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 16px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            font-family: inherit;
            box-shadow: 0 4px 12px rgba(108, 92, 231, 0.2);
            transition: transform 0.2s;
        }
        .btn-action:hover { transform: scale(1.03); }
        .btn-save { background: #00B894; }

        .output-container {
            position: relative;
            background-color: var(--text-bg);
            padding: 30px;
            border-radius: 20px;
            font-size: 26px; 
            line-height: 2.4;
            border: 3px dashed #CBD5E0;
            min-height: 120px;
            margin-top: 20px;
            user-select: text;
            color: #2D3748;
        }
        .reading-ruler {
            position: absolute;
            left: 0;
            right: 0;
            height: 60px;
            background: rgba(253, 203, 110, 0.35); /* Yumuşak sarı odak */
            border-top: 2px solid #FDCB6E;
            border-bottom: 2px solid #FDCB6E;
            pointer-events: none;
            display: none;
        }
        .bionic-bold { 
            color: var(--bionic-color); /* Koyu Mavi */
            font-weight: 800; 
        }
        .status-msg { margin-top: 8px; font-weight: 600; font-size: 14px; }
        .upload-zone {
            background: #F8F9FA;
            border: 2px dashed #CBD5E0;
            padding: 20px;
            border-radius: 16px;
            margin-top: 14px;
            text-align: center;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1 style="margin:0;">🧪 Süper Beyin Laboratuvarı 🚀</h1>
        <p style="margin:8px 0 0 0; font-size:17px;">Kelimeleri Görselleştir, Kendi Göz Hızında Oku ve Güçlen!</p>
    </div>

    <!-- Laboratuvar Anahtarı -->
    <div class="card" style="background:#FFFDF5; border:2px solid #FEF3C7;">
        <label><b>🔑 Laboratuvar Anahtarı (Gemini API):</b></label>
        <div style="display:flex; gap:10px; margin-top:8px;">
            <input type="password" id="apiKeyInput" placeholder="AIzaSy... anahtarını buraya yapıştır">
            <button class="btn-action btn-save" onclick="saveKey()">💾 Anahtarı Hafızaya Kaydet</button>
        </div>
        <div id="keyStatus" class="status-msg" style="color:#00B894;"></div>
    </div>

    <div class="card">
        <!-- Sayfa Işığı -->
        <label><b>🎨 Sayfa Işığı (Gözü Dinlendiren Filtreler):</b></label><br>
        <div style="margin-top:10px;">
            <button class="theme-btn" onclick="setBg('#FDF4E3')">🍯 Bal Peteği (Bej)</button>
            <button class="theme-btn" onclick="setBg('#E8F8F5')">🌱 Dinozor Nanesi</button>
            <button class="theme-btn" onclick="setBg('#FBEEE6')">🍑 Şeftali Bulutu</button>
            <button class="theme-btn" onclick="setBg('#EBF5FB')">🌊 Uzay Dalgası</button>
        </div>

        <!-- Akıllı Görsel Okuyucu -->
        <div class="upload-zone">
            <b>📸 Kitap Sayfasını Yükle (Yapay Zeka Okuyucu)</b>
            <input type="file" id="imageInput" accept="image/*" style="display:block; margin:12px auto;">
            <div id="ocrProgress" class="status-msg" style="display:none; color:var(--bionic-color);">🪄 Görsel taranıyor, harfler toplanıyor...</div>
        </div>

        <!-- Metin Kutusu (Bej Zemin) -->
        <label style="margin-top:18px; display:block;"><b>📝 Kâşifin Not Defteri:</b></label>
        <textarea id="textInput" oninput="applyBionic()">Bir zamanlar gökyüzünü merak eden bir kâşif varmış. Kâşif her gece yıldızların sırrını çözmek için laboratuvarında çalışırmış.</textarea>

        <!-- Kelime Rehberi & Sihirli Çubuk -->
        <div class="controls">
            <label>✨ <b>Harf Işığı (Biyonik Güç):</b></label>
            <input type="range" id="bionicRange" min="20" max="80" value="50" onchange="applyBionic()">
            <button class="btn-action" onclick="applyBionic()">✨ Kelimeleri Parlat</button>
            
            <label style="margin-left:14px; cursor:pointer; font-weight:600;">
                <input type="checkbox" id="rulerToggle" onchange="toggleRuler()"> 📏 <b>Sihirli Takip Çubuğu</b>
            </label>
        </div>
    </div>

    <!-- Okuma Masası (Bej Zemin) -->
    <div class="output-container" id="outputArea" onmousemove="moveRuler(event)">
        <div id="ruler" class="reading-ruler"></div>
        <div id="textOutput">Yazılar burada parlayacak...</div>
    </div>
</div>

<script>
function setBg(color) {
    document.documentElement.style.setProperty('--text-bg', color);
    if(color === '#FDF4E3') {
        document.documentElement.style.setProperty('--bg-color', '#F9F6EE');
    } else {
        document.documentElement.style.setProperty('--bg-color', color);
    }
}

// Biyonik Kelime Dönüştürücü (Koyu Mavi Vurgulu)
function applyBionic() {
    const text = document.getElementById('textInput').value;
    const ratio = document.getElementById('bionicRange').value / 100;
    if (!text.trim()) {
        document.getElementById('textOutput').innerHTML = "Yazılar burada parlayacak...";
        return;
    }

    const words = text.split(/\s+/);
    const transformed = words.map(word => {
        if (word.length <= 2) return `<span class="bionic-bold">${word}</span>`;
        const mid = Math.ceil(word.length * ratio);
        return `<span class="bionic-bold">${word.slice(0, mid)}</span>${word.slice(mid)}`;
    });
    document.getElementById('textOutput').innerHTML = transformed.join(' ');
}

// Sihirli Takip Çubuğu
function toggleRuler() {
    const ruler = document.getElementById('ruler');
    ruler.style.display = document.getElementById('rulerToggle').checked ? 'block' : 'none';
}
function moveRuler(e) {
    const ruler = document.getElementById('ruler');
    if (ruler.style.display === 'block') {
        const rect = document.getElementById('outputArea').getBoundingClientRect();
        const offsetY = e.clientY - rect.top - 30;
        ruler.style.top = Math.max(0, Math.min(offsetY, rect.height - 60)) + 'px';
    }
}

// API Anahtarı
function saveKey() {
    const k = document.getElementById('apiKeyInput').value.trim();
    if (k) {
        localStorage.setItem('superbrain_gemini_key', k);
        document.getElementById('keyStatus').innerText = "✓ Anahtar tarayıcı hafızasına güvenle kaydedildi!";
    } else {
        alert("Lütfen geçerli bir anahtar yapıştır.");
    }
}
window.onload = () => {
    const k = localStorage.getItem('superbrain_gemini_key');
    if (k) {
        document.getElementById('apiKeyInput').value = k;
        document.getElementById('keyStatus').innerText = "✓ Kayıtlı anahtar hazır!";
    }
    applyBionic();
};

// GÜÇLENDİRİLMİŞ OCR (Gemini 1.5 Flash Latest - Hata Çözümü)
document.getElementById('imageInput').addEventListener('change', function(e) {
    const file = e.target.files[0];
    if (!file) return;

    const apiKey = localStorage.getItem('superbrain_gemini_key');
    if (!apiKey) {
        alert("Lütfen önce en üstteki alana Laboratuvar Anahtarını (Gemini API) kaydedin!");
        return;
    }

    const prog = document.getElementById('ocrProgress');
    prog.style.display = 'block';
    prog.innerText = "🪄 Görsel okunuyor, harfler birleştiriliyor...";

    const reader = new FileReader();
    reader.readAsDataURL(file);
    reader.onload = (event) => {
        const img = new Image();
        img.src = event.target.result;
        img.onload = async () => {
            const canvas = document.createElement('canvas');
            const MAX_WIDTH = 1600; 
            let width = img.width;
            let height = img.height;
            
            if (width > MAX_WIDTH) {
                height = Math.round((height * MAX_WIDTH) / width);
                width = MAX_WIDTH;
            }
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);

            const optimizedBase64 = canvas.toDataURL('image/jpeg', 0.95).split(',')[1];

            try {
                // MODEL İSMİ GÜNCELLENDİ: gemini-1.5-flash-latest
                const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash-latest:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{
                            parts: [
                                { text: "Aşağıdaki görselde bulunan metni eksiksiz, olduğu gibi, yorum veya açıklama katmadan yaz." },
                                { inline_data: { mime_type: "image/jpeg", data: optimizedBase64 } }
                            ]
                        }]
                    })
                });
                
                const data = await res.json();
                
                if (data.error) {
                    alert("Yapay Zeka API Hatası: " + data.error.message);
                } else if (data.candidates && data.candidates[0].content.parts[0].text) {
                    document.getElementById('textInput').value = data.candidates[0].content.parts[0].text.trim();
                    applyBionic();
                } else {
                    alert("Görselde okunabilir net bir metin bulunamadı.");
                }
            } catch (err) {
                alert("İnternet veya bağlantı hatası oluştu. Lütfen tekrar dene.");
            } finally {
                prog.style.display = 'none';
                document.getElementById('imageInput').value = ""; 
            }
        };
    };
});
</script>

</body>
</html>
