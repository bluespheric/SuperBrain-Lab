<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Süper Beyin Laboratuvarı</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #FEF9E7;
            --primary: #6C5CE7;
            --accent: #FD79A8;
        }
        body {
            font-family: 'Fredoka', sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 24px;
            color: #2D3748;
            transition: background-color 0.3s ease;
        }
        .container {
            max-width: 860px;
            margin: 0 auto;
        }
        .header {
            background: linear-gradient(135deg, #6C5CE7, #a29bfe);
            color: white;
            padding: 24px;
            border-radius: 24px;
            text-align: center;
            box-shadow: 0 8px 24px rgba(108, 92, 231, 0.2);
            margin-bottom: 24px;
        }
        .card {
            background: #FFFFFF;
            padding: 24px;
            border-radius: 20px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.05);
            margin-bottom: 20px;
        }
        .theme-btn {
            padding: 10px 18px;
            border-radius: 14px;
            border: 2px solid #E2E8F0;
            cursor: pointer;
            font-weight: 600;
            background: white;
            margin-right: 8px;
            margin-bottom: 8px;
            font-family: inherit;
            transition: all 0.2s;
        }
        .theme-btn:hover {
            border-color: var(--primary);
            transform: translateY(-2px);
        }
        textarea, input[type="password"] {
            width: 100%;
            border-radius: 16px;
            border: 2px solid #E2E8F0;
            padding: 14px;
            font-size: 16px;
            font-family: inherit;
            box-sizing: border-box;
            outline: none;
            margin-top: 8px;
        }
        textarea { height: 120px; resize: vertical; }
        .controls {
            display: flex;
            gap: 12px;
            align-items: center;
            margin: 16px 0;
            flex-wrap: wrap;
        }
        .btn-action {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 16px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            font-family: inherit;
            box-shadow: 0 4px 12px rgba(108, 92, 231, 0.2);
            transition: transform 0.2s;
        }
        .btn-action:hover { transform: scale(1.03); }
        .btn-save { background: #00B894; }
        .btn-female-tr { background: linear-gradient(135deg, #FD79A8, #E84393); }
        .btn-male-tr { background: linear-gradient(135deg, #0984E3, #74B9FF); }
        .btn-female-en { background: linear-gradient(135deg, #A29BFE, #6C5CE7); }
        .btn-male-en { background: linear-gradient(135deg, #55EFC4, #00B894); color: #2D3748; }

        .output-container {
            position: relative;
            background-color: #FFFFFF;
            padding: 28px;
            border-radius: 20px;
            font-size: 22px;
            line-height: 2.3;
            border: 3px dashed var(--primary);
            min-height: 120px;
            margin-top: 20px;
            user-select: none;
        }
        .reading-ruler {
            position: absolute;
            left: 0;
            right: 0;
            height: 52px;
            background: rgba(255, 234, 167, 0.45);
            border-top: 2px solid #FDCB6E;
            border-bottom: 2px solid #FDCB6E;
            pointer-events: none;
            display: none;
        }
        .bionic-bold { color: var(--primary); font-weight: 800; }
        .upload-zone {
            background: #F8F9FA;
            border: 2px dashed #CBD5E0;
            padding: 20px;
            border-radius: 16px;
            margin-top: 14px;
            text-align: center;
        }
        .status-msg {
            margin-top: 8px;
            font-weight: 600;
            font-size: 14px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1 style="margin:0;">🧪 Süper Beyin Laboratuvarı 🚀</h1>
        <p style="margin:8px 0 0 0; font-size:17px;">Kelimeleri Işılda, Kendi Temponda Rahatça Keşfet!</p>
    </div>

    <!-- Laboratuvar Anahtarı -->
    <div class="card" style="background:#FFFDF5; border:2px solid #FEF3C7;">
        <label><b>🔑 Laboratuvar Anahtarı (Gemini API):</b></label>
        <div style="display:flex; gap:10px; margin-top:8px;">
            <input type="password" id="apiKeyInput" placeholder="AIzaSy... anahtarını buraya yapıştır">
            <button class="btn-action btn-save" onclick="saveKey()">💾 Anahtarı Hafızaya Kaydet</button>
        </div>
        <div id="keyStatus" class="status-msg" style="color:#00B894;"></div>
    </div>

    <div class="card">
        <!-- Sayfa Işığı -->
        <label><b>🎨 Sayfa Işığı:</b></label><br>
        <div style="margin-top:10px;">
            <button class="theme-btn" onclick="setBg('#FEF9E7')">🍯 Bal Peteği</button>
            <button class="theme-btn" onclick="setBg('#E8F8F5')">🌱 Dinozor Nanesi</button>
            <button class="theme-btn" onclick="setBg('#FBEEE6')">🍑 Şeftali Bulutu</button>
            <button class="theme-btn" onclick="setBg('#EBF5FB')">🌊 Uzay Dalgası</button>
        </div>

        <!-- Akıllı Görsel Okuyucu -->
        <div class="upload-zone">
            <b>📸 Kitabının Sayfasını Yükle (Akıllı Okuyucu)</b>
            <input type="file" id="imageInput" accept="image/*" style="display:block; margin:12px auto;">
            <div id="ocrProgress" class="status-msg" style="display:none; color:var(--primary);">🪄 Sayfa taranıyor ve metin ayıklanıyor, lütfen bekle...</div>
        </div>

        <!-- Metin Kutusu -->
        <label style="margin-top:18px; display:block;"><b>📝 Kâşifin Not Defteri:</b></label>
        <textarea id="textInput">Bir zamanlar meraklı bir kâşif varmış. Bu kâşif Süper Beyin Laboratuvarında yepyeni dünyalar keşfetmeye bayılırmış.</textarea>

        <!-- Kelime Rehberi & Sihirli Çubuk -->
        <div class="controls">
            <label>✨ <b>Harf Işığı:</b></label>
            <input type="range" id="bionicRange" min="20" max="80" value="50">
            <button class="btn-action" onclick="applyBionic()">✨ Kelimeleri Parlat</button>
            
            <label style="margin-left:14px; cursor:pointer; font-weight:600;">
                <input type="checkbox" id="rulerToggle" onchange="toggleRuler()"> 📏 <b>Sihirli Takip Çubuğu</b>
            </label>
        </div>

        <!-- Sesli Anlatıcı -->
        <label style="display:block; margin-top:14px;"><b>🎧 Sesli Anlatıcı:</b></label>
        <div class="controls">
            <button class="btn-action btn-female-tr" onclick="playFemaleTR()">🧚 Masalcı Peri (Kadın Sesi)</button>
            <button class="btn-action btn-male-tr" onclick="speakBrowser('tr-male')">🧙‍♂️ Bilge Kâşif (Erkek Sesi)</button>
            <button class="btn-action btn-female-en" onclick="speakBrowser('en-female')">👩‍🏫 Storyteller (EN Kadın)</button>
            <button class="btn-action btn-male-en" onclick="speakBrowser('en-male')">👨‍🚀 Captain Explorer (EN Erkek)</button>
        </div>
    </div>

    <!-- Okuma Alanı -->
    <div class="output-container" id="outputArea" onmousemove="moveRuler(event)">
        <div id="ruler" class="reading-ruler"></div>
        <div id="textOutput">Yazılar burada parlayacak...</div>
    </div>
</div>

<audio id="femaleAudioPlayer" style="display:none;"></audio>

<script>
// Sayfa Işığı
function setBg(color) {
    document.documentElement.style.setProperty('--bg-color', color);
}

// Biyonik Kelime Rehberi
function applyBionic() {
    const text = document.getElementById('textInput').value;
    const ratio = document.getElementById('bionicRange').value / 100;
    if (!text.trim()) return;

    const words = text.split(/\s+/);
    const transformed = words.map(word => {
        if (word.length <= 2) return `<span class="bionic-bold">${word}</span>`;
        const mid = Math.ceil(word.length * ratio);
        return `<span class="bionic-bold">${word.slice(0, mid)}</span>${word.slice(mid)}`;
    });
    document.getElementById('textOutput').innerHTML = transformed.join(' ');
}

// Sihirli Takip Çubuğu
function toggleRuler() {
    const ruler = document.getElementById('ruler');
    ruler.style.display = document.getElementById('rulerToggle').checked ? 'block' : 'none';
}
function moveRuler(e) {
    const ruler = document.getElementById('ruler');
    if (ruler.style.display === 'block') {
        const rect = document.getElementById('outputArea').getBoundingClientRect();
        const offsetY = e.clientY - rect.top - 24;
        ruler.style.top = Math.max(0, Math.min(offsetY, rect.height - 52)) + 'px';
    }
}

// API Anahtarı Kaydetme
function saveKey() {
    const k = document.getElementById('apiKeyInput').value.trim();
    if (k) {
        localStorage.setItem('superbrain_gemini_key', k);
        document.getElementById('keyStatus').innerText = "✓ Anahtar tarayıcı hafızasına güvenle kaydedildi!";
    } else {
        alert("Lütfen geçerli bir anahtar yapıştır.");
    }
}
window.onload = () => {
    const k = localStorage.getItem('superbrain_gemini_key');
    if (k) {
        document.getElementById('apiKeyInput').value = k;
        document.getElementById('keyStatus').innerText = "✓ Kayıtlı anahtar hazır!";
    }
    applyBionic();
};

// 1. TÜRKÇE KADIN SESİ (Cihazın ses paketine bağımlı olmayan garanti kadın sesi)
function playFemaleTR() {
    const text = document.getElementById('textInput').value.trim();
    if (!text) return;

    window.speechSynthesis.cancel();
    const player = document.getElementById('femaleAudioPlayer');
    
    // Güvenilir bulut tabanlı Türkçe kadın ses kaynağı (ResponsiveVoice / Akıcı Kadın TTS Endpoint)
    const encodedText = encodeURIComponent(text);
    const soundUrl = `https://translate.google.com/translate_tts?ie=UTF-8&tl=tr-TR&client=tw-ob&q=${encodedText}`;
    
    player.src = soundUrl;
    player.play().catch(() => {
        // Doğrudan çalma engellenirse doğal tınılı tarayıcı yedeklemesi
        speakBrowser('tr-female-fallback');
    });
}

// DİĞER SESLER (Tarayıcı Motoru)
function speakBrowser(type) {
    let text = document.getElementById('textInput').value.trim();
    if (!text) return;

    // Kadın oynatıcı çalıyorsa durdur
    const player = document.getElementById('femaleAudioPlayer');
    player.pause();

    window.speechSynthesis.cancel();
    const utterance = new SpeechSynthesisUtterance(text);
    const voices = window.speechSynthesis.getVoices();

    if (type === 'tr-male') {
        utterance.lang = 'tr-TR';
        const mVoice = voices.find(v => v.lang.startsWith('tr') && (v.name.toLowerCase().includes('male') || v.name.toLowerCase().includes('cem') || v.name.toLowerCase().includes('tolga')));
        if (mVoice) utterance.voice = mVoice;
        utterance.pitch = 0.70;
        utterance.rate = 0.88;
    } else if (type === 'tr-female-fallback') {
        utterance.lang = 'tr-TR';
        utterance.pitch = 1.6;
        utterance.rate = 0.95;
    } else if (type === 'en-female') {
        utterance.lang = 'en-US';
        const fVoice = voices.find(v => v.lang.startsWith('en') && (v.name.toLowerCase().includes('female') || v.name.toLowerCase().includes('zira') || v.name.toLowerCase().includes('samantha')));
        if (fVoice) utterance.voice = fVoice;
        utterance.pitch = 1.15;
        utterance.rate = 0.90;
    } else if (type === 'en-male') {
        utterance.lang = 'en-US';
        const mVoice = voices.find(v => v.lang.startsWith('en') && (v.name.toLowerCase().includes('male') || v.name.toLowerCase().includes('david') || v.name.toLowerCase().includes('george')));
        if (mVoice) utterance.voice = mVoice;
        utterance.pitch = 0.80;
        utterance.rate = 0.88;
    }

    window.speechSynthesis.speak(utterance);
}
window.speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();

// 2. GÖRSEL OKUMA (Boyut Sıkıştırma + Güvenli Base64 Gemini Vision)
document.getElementById('imageInput').addEventListener('change', function(e) {
    const file = e.target.files[0];
    if (!file) return;

    const apiKey = localStorage.getItem('superbrain_gemini_key');
    if (!apiKey) {
        alert("Lütfen önce en üstteki kutudan Laboratuvar Anahtarını (Gemini API) kaydedin!");
        return;
    }

    const prog = document.getElementById('ocrProgress');
    prog.style.display = 'block';

    // Büyük fotoğrafları tarayıcı içinde 1200px'e sıkıştırıp gönderiyoruz (API kotasını ve çökmesini önler)
    const reader = new FileReader();
    reader.readAsDataURL(file);
    reader.onload = (event) => {
        const img = new Image();
        img.src = event.target.result;
        img.onload = async () => {
            const canvas = document.createElement('canvas');
            const MAX_WIDTH = 1200;
            let width = img.width;
            let height = img.height;

            if (width > MAX_WIDTH) {
                height = Math.round((height * MAX_WIDTH) / width);
                width = MAX_WIDTH;
            }

            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);

            // Güvenli JPEG formatına çevir
            const optimizedBase64 = canvas.toDataURL('image/jpeg', 0.85).split(',')[1];

            try {
                const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{
                            parts: [
                                { text: "Bu görselde yer alan yazılı metni harfi harfine eksiksiz oku. Başına veya sonuna hiçbir açıklama, yorum veya selamlama ekleme; yalnızca fotoğraftaki metni aktar." },
                                { inline_data: { mime_type: "image/jpeg", data: optimizedBase64 } }
                            ]
                        }]
                    })
                });

                const data = await res.json();
                
                if (data.candidates && data.candidates[0].content.parts[0].text) {
                    document.getElementById('textInput').value = data.candidates[0].content.parts[0].text.trim();
                    applyBionic();
                } else if (data.error) {
                    alert("API Hatası: " + data.error.message);
                } else {
                    alert("Sayfada metin tespit edilemedi.");
                }
            } catch (err) {
                alert("Bağlantı sırasında bir sorun oluştu. API anahtarını ve internet bağlantını kontrol et!");
            } finally {
                prog.style.display = 'none';
            }
        };
    };
});
</script>

</body>
</html>
