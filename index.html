<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Süper Beyin Laboratuvarı</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #FEF9E7;
            --primary: #6C5CE7;
            --accent: #FD79A8;
        }
        body {
            font-family: 'Fredoka', sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 24px;
            color: #2D3748;
            transition: background-color 0.3s ease;
        }
        .container {
            max-width: 880px;
            margin: 0 auto;
        }
        .header {
            background: linear-gradient(135deg, #6C5CE7, #a29bfe);
            color: white;
            padding: 24px;
            border-radius: 24px;
            text-align: center;
            box-shadow: 0 8px 24px rgba(108, 92, 231, 0.2);
            margin-bottom: 24px;
        }
        .card {
            background: #FFFFFF;
            padding: 24px;
            border-radius: 20px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.05);
            margin-bottom: 20px;
        }
        .theme-btn {
            padding: 10px 18px;
            border-radius: 14px;
            border: 2px solid #E2E8F0;
            cursor: pointer;
            font-weight: 600;
            background: white;
            margin-right: 8px;
            margin-bottom: 8px;
            font-family: inherit;
        }
        textarea, input[type="password"] {
            width: 100%;
            border-radius: 16px;
            border: 2px solid #E2E8F0;
            padding: 14px;
            font-size: 17px;
            font-family: inherit;
            box-sizing: border-box;
            outline: none;
            margin-top: 8px;
        }
        textarea { height: 120px; resize: vertical; }
        .controls {
            display: flex;
            gap: 10px;
            align-items: center;
            margin: 14px 0;
            flex-wrap: wrap;
        }
        .btn-action {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 12px 18px;
            border-radius: 16px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            font-family: inherit;
            box-shadow: 0 4px 12px rgba(108, 92, 231, 0.2);
            transition: transform 0.2s;
        }
        .btn-action:hover { transform: scale(1.03); }
        .btn-save { background: #00B894; }
        .btn-female-tr { background: linear-gradient(135deg, #FD79A8, #E84393); }
        .btn-male-tr { background: linear-gradient(135deg, #0984E3, #74B9FF); }
        .btn-female-en { background: linear-gradient(135deg, #A29BFE, #6C5CE7); }
        .btn-male-en { background: linear-gradient(135deg, #55EFC4, #00B894); color: #2D3748; }

        .output-container {
            position: relative;
            background-color: #FFFFFF;
            padding: 28px;
            border-radius: 20px;
            font-size: 24px;
            line-height: 2.3;
            border: 3px dashed var(--primary);
            min-height: 120px;
            margin-top: 20px;
        }
        .reading-ruler {
            position: absolute;
            left: 0;
            right: 0;
            height: 52px;
            background: rgba(255, 234, 167, 0.45);
            border-top: 2px solid #FDCB6E;
            border-bottom: 2px solid #FDCB6E;
            pointer-events: none;
            display: none;
        }
        .bionic-bold { color: var(--primary); font-weight: 800; }
        
        .word-span {
            cursor: pointer;
            padding: 2px 6px;
            border-radius: 6px;
            transition: all 0.1s ease;
        }
        .word-span:hover { background-color: rgba(108, 92, 231, 0.12); }
        
        /* PARLAK SARI FOSFOR IŞIK */
        .word-active {
            background-color: #FFF176 !important;
            color: #2D3748 !important;
            border-bottom: 4px solid #FBC02D;
            border-radius: 6px;
            box-shadow: 0 2px 8px rgba(251, 192, 45, 0.4);
        }
        
        .mode-box {
            background: #F8F9FA;
            padding: 16px;
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 12px;
            border-left: 5px solid var(--primary);
        }
        .radio-label {
            cursor: pointer;
            font-weight: 600;
            font-size: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
            color: #4A5568;
        }
        .status-msg {
            margin-top: 8px;
            font-weight: 600;
            font-size: 14px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1 style="margin:0;">🧪 Süper Beyin Laboratuvarı 🚀</h1>
        <p style="margin:8px 0 0 0; font-size:17px;">Kelimeleri Işılda, Kendi Temponda Rahatça Keşfet!</p>
    </div>

    <!-- Laboratuvar Anahtarı (Gemini API) -->
    <div class="card" style="background:#FFFDF5; border:2px solid #FEF3C7;">
        <label><b>🔑 Laboratuvar Anahtarı (Gemini API):</b></label>
        <div style="display:flex; gap:10px; margin-top:8px;">
            <input type="password" id="apiKeyInput" placeholder="AIzaSy... anahtarını buraya yapıştır">
            <button class="btn-action btn-save" onclick="saveKey()">💾 Anahtarı Hafızaya Kaydet</button>
        </div>
        <div id="keyStatus" class="status-msg" style="color:#00B894;"></div>
    </div>

    <div class="card">
        <!-- Sayfa Işığı -->
        <label><b>🎨 Sayfa Işığı:</b></label><br>
        <div style="margin-top:10px;">
            <button class="theme-btn" onclick="setBg('#FEF9E7')">🍯 Bal Peteği</button>
            <button class="theme-btn" onclick="setBg('#E8F8F5')">🌱 Dinozor Nanesi</button>
            <button class="theme-btn" onclick="setBg('#FBEEE6')">🍑 Şeftali Bulutu</button>
            <button class="theme-btn" onclick="setBg('#EBF5FB')">🌊 Uzay Dalgası</button>
        </div>

        <!-- Akıllı Görsel Okuyucu -->
        <div style="background:#F8F9FA; border:2px dashed #CBD5E0; padding:16px; border-radius:16px; margin-top:14px; text-align:center;">
            <b>📸 Kitabının Sayfasını Yükle (Akıllı Okuyucu)</b>
            <input type="file" id="imageInput" accept="image/*" style="display:block; margin:10px auto;">
            <div id="ocrProgress" class="status-msg" style="display:none; color:var(--primary);">🪄 Gemini sayfayı inceliyor, metin aktarılıyor...</div>
        </div>

        <!-- Metin Kutusu -->
        <label style="margin-top:18px; display:block;"><b>📝 Kâşifin Not Defteri:</b></label>
        <textarea id="textInput" oninput="applyBionic()">Bir zamanlar meraklı bir kâşif varmış. Bu kâşif Süper Beyin Laboratuvarında yepyeni dünyalar keşfetmeye bayılırmış.</textarea>

        <!-- 3 OKUMA MODU -->
        <div class="mode-box">
            <span style="color:#2D3748;">🧭 <b>Okuma Modunu Seç:</b></span>
            
            <label class="radio-label">
                <input type="radio" name="readMode" value="1" checked> 
                🎯 <b>1. Mod (Seçileni Oku):</b> Not defterinden fareyle boyadığın kısmı aşağıdaki butonla okur.
            </label>
            
            <label class="radio-label">
                <input type="radio" name="readMode" value="2"> 
                🚀 <b>2. Mod (Akıcı Işık):</b> Aşağıdaki masada tıkladığın kelimeden başlar, akıcı okur ve ışık takip eder.
            </label>
            
            <label class="radio-label">
                <input type="radio" name="readMode" value="3"> 
                🐢 <b>3. Mod (Tane Tane):</b> Aşağıdaki masada tıkladığın kelimeden başlar, yavaşça okur ve ışık sindire sindire bekler.
            </label>
        </div>

        <!-- Harf Işığı & Takip Çubuğu -->
        <div class="controls" style="margin-top:15px;">
            <label>✨ <b>Harf Işığı:</b></label>
            <input type="range" id="bionicRange" min="20" max="80" value="50" onchange="applyBionic()">
            <button class="btn-action" onclick="applyBionic()">✨ Kelimeleri Parlat</button>
            
            <label style="margin-left:14px; cursor:pointer; font-weight:600;">
                <input type="checkbox" id="rulerToggle" onchange="toggleRuler()"> 📏 <b>Sihirli Takip Çubuğu</b>
            </label>
        </div>

        <!-- SES BUTONLARI -->
        <label style="display:block; margin-top:14px;"><b>🎧 Sesli Anlatıcı:</b></label>
        <div class="controls">
            <button class="btn-action btn-female-tr" onclick="startVoice('tr', 'female')">🧚 Masalcı Peri (Kadın Sesi)</button>
            <button class="btn-action btn-male-tr" onclick="startVoice('tr', 'male')">🧙‍♂️ Bilge Kâşif (Erkek Sesi)</button>
            <button class="btn-action btn-female-en" onclick="startVoice('en', 'female')">👩‍🏫 Storyteller (EN Kadın)</button>
            <button class="btn-action btn-male-en" onclick="startVoice('en', 'male')">👨‍🚀 Captain Explorer (EN Erkek)</button>
            <button class="btn-action" style="background:#E17055;" onclick="stopVoice()">⏹️ Durdur</button>
        </div>
    </div>

    <!-- OKUMA MASASI -->
    <div class="output-container" id="outputArea" onmousemove="moveRuler(event)">
        <div id="ruler" class="reading-ruler"></div>
        <div id="textOutput">Yazılar burada parlayacak...</div>
    </div>
</div>

<script>
let wordsList = [];
let lightTimer = null;
let currentLang = 'tr';
let currentGender = 'female';

function setBg(color) {
    document.documentElement.style.setProperty('--bg-color', color);
}

// Biyonik Kelime Rehberi
function applyBionic() {
    const text = document.getElementById('textInput').value;
    const ratio = document.getElementById('bionicRange').value / 100;
    if (!text.trim()) {
        document.getElementById('textOutput').innerHTML = "";
        return;
    }

    wordsList = text.trim().split(/\s+/);
    const transformed = wordsList.map((word, idx) => {
        let bionicWord = "";
        if (word.length <= 2) {
            bionicWord = `<span class="bionic-bold">${word}</span>`;
        } else {
            const mid = Math.ceil(word.length * ratio);
            bionicWord = `<span class="bionic-bold">${word.slice(0, mid)}</span>${word.slice(mid)}`;
        }
        return `<span class="word-span" id="w_${idx}" onclick="wordClicked(${idx})">${bionicWord}</span>`;
    });

    document.getElementById('textOutput').innerHTML = transformed.join(' ');
}

// Takip Çubuğu
function toggleRuler() {
    const isChecked = document.getElementById('rulerToggle').checked;
    document.getElementById('ruler').style.display = isChecked ? 'block' : 'none';
}

function moveRuler(e) {
    const ruler = document.getElementById('ruler');
    if (ruler.style.display === 'block') {
        const rect = document.getElementById('outputArea').getBoundingClientRect();
        const offsetY = e.clientY - rect.top - 24;
        ruler.style.top = Math.max(0, Math.min(offsetY, rect.height - 52)) + 'px';
    }
}

// API Kaydet
function saveKey() {
    const k = document.getElementById('apiKeyInput').value.trim();
    if (k) {
        localStorage.setItem('superbrain_gemini_key', k);
        document.getElementById('keyStatus').innerText = "✓ Anahtar tarayıcı hafızasına güvenle kaydedildi!";
    } else {
        alert("Lütfen geçerli bir anahtar yapıştır.");
    }
}

window.onload = () => {
    const k = localStorage.getItem('superbrain_gemini_key');
    if (k) {
        document.getElementById('apiKeyInput').value = k;
        document.getElementById('keyStatus').innerText = "✓ Kayıtlı anahtar hazır!";
    }
    applyBionic();
};

function highlightWord(idx) {
    document.querySelectorAll('.word-span').forEach(el => el.classList.remove('word-active'));
    const target = document.getElementById(`w_${idx}`);
    if (target) {
        target.classList.add('word-active');
    }
}

function stopVoice() {
    clearTimeout(lightTimer);
    window.speechSynthesis.cancel();
    document.querySelectorAll('.word-span').forEach(el => el.classList.remove('word-active'));
}

// SES BAŞLATICI (Butonlara Tıklanınca)
function startVoice(lang, gender) {
    currentLang = lang;
    currentGender = gender;
    
    const mode = document.querySelector('input[name="readMode"]:checked').value;
    const textarea = document.getElementById('textInput');

    if (mode === '1') {
        // 1. Mod: Seçilen Parça
        let sel = textarea.value.substring(textarea.selectionStart, textarea.selectionEnd).trim();
        if (!sel) sel = textarea.value.trim(); // Seçilmediyse tamamı
        speakText(sel, 1.0, null);
    } else {
        // 2 veya 3. Modda butona basılırsa en baştan başlar
        startFlowFrom(0, mode);
    }
}

// Masadaki Kelimeye Tıklanınca (Mod 2 ve Mod 3)
function wordClicked(idx) {
    const mode = document.querySelector('input[name="readMode"]:checked').value;
    if (mode === '1') {
        alert("Şu an '1. Mod (Seçileni Oku)' seçili. Kelimeden ışıkla okutmak için 2. veya 3. modu işaretle.");
        return;
    }
    startFlowFrom(idx, mode);
}

// Akış ve Işık Başlatıcı
function startFlowFrom(startIdx, mode) {
    stopVoice();
    const remainingWords = wordsList.slice(startIdx);
    if (remainingWords.length === 0) return;

    const fullText = remainingWords.join(' ');
    const rate = (mode === '3') ? 0.65 : 0.95; // Tane tane veya akıcı hız
    speakText(fullText, rate, () => {
        stopVoice();
    });

    // Işık Takibi
    const stepInterval = (mode === '3') ? 650 : 360;
    let curr = startIdx;

    function step() {
        if (curr < wordsList.length) {
            highlightWord(curr);
            curr++;
            lightTimer = setTimeout(step, stepInterval);
        } else {
            document.querySelectorAll('.word-span').forEach(el => el.classList.remove('word-active'));
        }
    }
    step();
}

// KESİN ÇALIŞAN DOĞAL SES MOTORU (Tarayıcı Engeline Takılmaz)
function speakText(text, rate, onEndCallback) {
    window.speechSynthesis.cancel();
    
    // İnceltmeleri yumuşatma
    const cleanText = text.replace(/kâ/gi, "kyaa").replace(/gâ/gi, "gyaa").replace(/lâ/gi, "lyaa");
    const utterance = new SpeechSynthesisUtterance(cleanText);
    const voices = window.speechSynthesis.getVoices();

    if (currentLang === 'tr') {
        utterance.lang = 'tr-TR';
        if (currentGender === 'female') {
            const fv = voices.find(v => v.lang.startsWith('tr') && (v.name.includes('Yelda') || v.name.includes('Filiz') || v.name.includes('Female')));
            if (fv) utterance.voice = fv;
            utterance.pitch = 1.45; // Kesin peri kadın sesi tınısı
        } else {
            const mv = voices.find(v => v.lang.startsWith('tr') && (v.name.includes('Tolga') || v.name.includes('Cem') || v.name.includes('Male')));
            if (mv) utterance.voice = mv;
            utterance.pitch = 0.70; // Tok bilge erkek tonu
        }
    } else {
        utterance.lang = 'en-US';
        if (currentGender === 'female') {
            const efv = voices.find(v => v.lang.startsWith('en') && (v.name.includes('Samantha') || v.name.includes('Female') || v.name.includes('Zira')));
            if (efv) utterance.voice = efv;
            utterance.pitch = 1.15;
        } else {
            const emv = voices.find(v => v.lang.startsWith('en') && (v.name.includes('David') || v.name.includes('Male')));
            if (emv) utterance.voice = emv;
            utterance.pitch = 0.80;
        }
    }

    utterance.rate = rate;
    if (onEndCallback) utterance.onend = onEndCallback;
    window.speechSynthesis.speak(utterance);
}
window.speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();

// GEMINI OCR
document.getElementById('imageInput').addEventListener('change', function(e) {
    const file = e.target.files[0];
    if (!file) return;

    const apiKey = localStorage.getItem('superbrain_gemini_key');
    if (!apiKey) {
        alert("Lütfen önce en üstteki kutudan Laboratuvar Anahtarını kaydedin!");
        return;
    }

    const prog = document.getElementById('ocrProgress');
    prog.style.display = 'inline-block';

    const reader = new FileReader();
    reader.readAsDataURL(file);
    reader.onload = (event) => {
        const img = new Image();
        img.src = event.target.result;
        img.onload = async () => {
            const canvas = document.createElement('canvas');
            const MAX_WIDTH = 1000;
            let width = img.width, height = img.height;
            if (width > MAX_WIDTH) { height = Math.round(height * MAX_WIDTH / width); width = MAX_WIDTH; }
            canvas.width = width; canvas.height = height;
            canvas.getContext('2d').drawImage(img, 0, 0, width, height);

            const optimizedBase64 = canvas.toDataURL('image/jpeg', 0.8).split(',')[1];

            try {
                const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{
                            parts: [
                                { text: "Görseldeki yazıyı harfi harfine oku. Yalnızca metni aktar." },
                                { inline_data: { mime_type: "image/jpeg", data: optimizedBase64 } }
                            ]
                        }]
                    })
                });
                const data = await res.json();
                if (data.candidates && data.candidates[0].content.parts[0].text) {
                    document.getElementById('textInput').value = data.candidates[0].content.parts[0].text.trim();
                    applyBionic();
                }
            } catch (err) { alert("Bağlantı hatası!"); } 
            finally { prog.style.display = 'none'; }
        };
    };
});
</script>

</body>
</html>
