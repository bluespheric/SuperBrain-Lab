<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🧪 Süper Beyin Laboratuvarı 🚀</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
    <!-- Kararlı OCR Kütüphanesi -->
    <script src="https://unpkg.com/tesseract.js@v4.0.2/dist/tesseract.min.js"></script>
    <style>
        :root {
            --bg-color: #FEF9E7;
            --primary: #6C5CE7;
            --accent: #FD79A8;
        }
        body {
            font-family: 'Fredoka', sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 20px;
            color: #2D3748;
            transition: background-color 0.3s;
        }
        .container {
            max-width: 850px;
            margin: 0 auto;
        }
        .header {
            background: linear-gradient(135deg, #6C5CE7, #a29bfe);
            color: white;
            padding: 22px;
            border-radius: 24px;
            text-align: center;
            box-shadow: 0 8px 20px rgba(108, 92, 231, 0.2);
            margin-bottom: 20px;
        }
        .card {
            background: #FFFFFF;
            padding: 22px;
            border-radius: 20px;
            box-shadow: 0 4px 14px rgba(0,0,0,0.06);
            margin-bottom: 20px;
        }
        .theme-btn {
            padding: 8px 16px;
            border-radius: 12px;
            border: 2px solid #E2E8F0;
            cursor: pointer;
            font-weight: 600;
            background: white;
            margin-right: 8px;
            margin-bottom: 8px;
        }
        textarea {
            width: 100%;
            height: 120px;
            border-radius: 14px;
            border: 2px solid #E2E8F0;
            padding: 12px;
            font-size: 17px;
            font-family: inherit;
            box-sizing: border-box;
            outline: none;
            margin-top: 10px;
        }
        .controls {
            display: flex;
            gap: 12px;
            align-items: center;
            margin: 15px 0;
            flex-wrap: wrap;
        }
        .btn-action {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 12px 22px;
            border-radius: 16px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(108, 92, 231, 0.25);
            transition: transform 0.2s;
        }
        .btn-action:hover {
            transform: scale(1.03);
        }
        .btn-sound {
            background-color: var(--accent);
        }
        .output-box {
            background-color: #FFFFFF;
            padding: 25px;
            border-radius: 20px;
            font-size: 23px;
            line-height: 2.3;
            border: 3px dashed var(--primary);
            min-height: 100px;
            margin-top: 15px;
        }
        .bionic-bold {
            color: var(--primary);
            font-weight: 800;
        }
        .ocr-zone {
            background: #F8F9FA;
            border: 2px dashed #A0AEC0;
            padding: 15px;
            border-radius: 16px;
            margin-top: 12px;
            text-align: center;
        }
        #ocrProgress {
            font-weight: bold;
            color: var(--primary);
            margin-top: 10px;
            display: none;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1 style="margin:0;">🧪 Süper Beyin Laboratuvarı 🚀</h1>
        <p style="margin:6px 0 0 0; font-size:17px;">Kitabını Tara, Dinle, Kendi Hızında Oku!</p>
    </div>

    <div class="card">
        <label><b>🎨 Büyülü Zemin Rengi:</b></label><br>
        <div style="margin-top:8px;">
            <button class="theme-btn" onclick="setBg('#FEF9E7')">🍯 Bal Peteği</button>
            <button class="theme-btn" onclick="setBg('#E8F8F5')">🌱 Dinozor Nanesi</button>
            <button class="theme-btn" onclick="setBg('#FBEEE6')">🍑 Şeftali Bulutu</button>
            <button class="theme-btn" onclick="setBg('#EBF5FB')">🌊 Uzay Dalgası</button>
        </div>

        <!-- Görsel Yükleme & OCR -->
        <div class="ocr-zone">
            <b>📸 Kitap Sayfası / Ödev Fotoğrafı Yükle</b>
            <input type="file" id="imageInput" accept="image/*" style="display:block; margin:10px auto;">
            <img id="imagePreview" style="max-width:200px; display:none; margin:10px auto; border-radius:8px;" alt="Önizleme">
            <div id="ocrProgress">🔍 Sayfa okunuyor... Lütfen bekle.</div>
        </div>

        <label style="margin-top:15px; display:block;"><b>📝 Hikaye ya da Okuma Metni:</b></label>
        <textarea id="textInput">Bir zamanlar meraklı bir kâşif varmış. Bu kâşif Süper Beyin Laboratuvarında yepyeni dünyalar keşfetmeye bayılırmış.</textarea>

        <div class="controls">
            <label>⚡ <b>Odak Gücü:</b></label>
            <input type="range" id="bionicRange" min="20" max="80" value="50">
            <button class="btn-action" onclick="applyBionic()">🚀 Sihirli Yazıya Çevir</button>
            <button class="btn-action btn-sound" onclick="speakFemale()">👩‍🏫 Doğal Kadın Sesiyle Dinle</button>
            <select id="voiceSelect" style="padding:10px; border-radius:12px; border:2px solid #E2E8F0; font-family:inherit;"></select>
        </div>
    </div>

    <div class="output-box" id="outputArea">
        Metin burada biyonik okuma modunda görünecek...
    </div>
</div>

<script>
function setBg(color) {
    document.documentElement.style.setProperty('--bg-color', color);
}

// Biyonik Okuma
function applyBionic() {
    const text = document.getElementById('textInput').value;
    const ratio = document.getElementById('bionicRange').value / 100;
    if (!text.trim()) return;

    const words = text.split(/\s+/);
    const transformed = words.map(word => {
        if (word.length <= 2) {
            return `<span class="bionic-bold">${word}</span>`;
        }
        const mid = Math.ceil(word.length * ratio);
        return `<span class="bionic-bold">${word.slice(0, mid)}</span>${word.slice(mid)}`;
    });

    document.getElementById('outputArea').innerHTML = transformed.join(' ');
}

// Ses Motoru: Doğal Türkçe Kadın Sesi Seçici
let voices = [];
function loadVoices() {
    voices = window.speechSynthesis.getVoices();
    const voiceSelect = document.getElementById('voiceSelect');
    voiceSelect.innerHTML = '';

    // Türkçe ve İngilizce sesleri ayıkla
    const relevantVoices = voices.filter(v => v.lang.startsWith('tr') || v.lang.startsWith('en'));
    
    relevantVoices.forEach(voice => {
        const option = document.createElement('option');
        option.value = voice.name;
        option.textContent = `${voice.name} (${voice.lang})`;
        // Tercihen Türkçe kadın seslerini seç (Filiz, Yelda, Sümeyye vb.)
        if (voice.lang.startsWith('tr') && (voice.name.includes('Yelda') || voice.name.includes('Filiz') || voice.name.includes('Emel') || voice.name.includes('Female'))) {
            option.selected = true;
        }
        voiceSelect.appendChild(option);
    });
}

window.speechSynthesis.onvoiceschanged = loadVoices;
loadVoices();

function speakFemale() {
    let text = document.getElementById('textInput').value;
    if (!text.trim()) return;

    // Fonetik düzeltme: Şapkalı harfleri ve inceltmeleri telaffuza uygun yumuşatma
    text = text.replace(/kâ/gi, "kyaa").replace(/gâ/gi, "gyaa").replace(/lâ/gi, "lyaa");

    window.speechSynthesis.cancel();
    const utterance = new SpeechSynthesisUtterance(text);

    const voiceSelect = document.getElementById('voiceSelect');
    const selectedVoice = voices.find(v => v.name === voiceSelect.value);
    if (selectedVoice) {
        utterance.voice = selectedVoice;
    }

    utterance.rate = 0.92; // Çocuklar için sakin ve net hız
    utterance.pitch = 1.1; // Yumuşak ve doğal kadın ses perdesi
    window.speechSynthesis.speak(utterance);
}

// Tesseract OCR Entegrasyonu
document.getElementById('imageInput').addEventListener('change', function(e) {
    const file = e.target.files[0];
    if (!file) return;

    const imgPreview = document.getElementById('imagePreview');
    imgPreview.src = URL.createObjectURL(file);
    imgPreview.style.display = 'block';

    const prog = document.getElementById('ocrProgress');
    prog.style.display = 'block';
    prog.innerText = "🔍 Sayfa taranıyor... (%0)";

    Tesseract.recognize(
        file,
        'tur',
        {
            logger: m => {
                if (m.status === 'recognizing text') {
                    prog.innerText = `🔍 Harfler toplanıyor... %${Math.floor(m.progress * 100)}`;
                }
            }
        }
    ).then(({ data: { text } }) => {
        prog.style.display = 'none';
        if (text.trim()) {
            document.getElementById('textInput').value = text;
            applyBionic();
        } else {
            alert("Sayfada net bir yazı bulunamadı. Işığı artırıp tekrar dene!");
        }
    }).catch(err => {
        prog.style.display = 'none';
        alert("Tarama sırasında bir hata oluştu: " + err);
    });
});

// Sayfa açıldığında biyonik metni göster
applyBionic();
</script>

</body>
</html>
