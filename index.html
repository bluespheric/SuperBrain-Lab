<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Süper Beyin Laboratuvarı</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #FEF9E7;
            --primary: #6C5CE7;
        }
        body {
            font-family: 'Fredoka', sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 24px;
            color: #2D3748;
            transition: background-color 0.3s ease;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
        }
        .header {
            background: linear-gradient(135deg, #6C5CE7, #a29bfe);
            color: white;
            padding: 24px;
            border-radius: 24px;
            text-align: center;
            box-shadow: 0 8px 24px rgba(108, 92, 231, 0.2);
            margin-bottom: 24px;
        }
        .card {
            background: #FFFFFF;
            padding: 24px;
            border-radius: 20px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.05);
            margin-bottom: 20px;
        }
        .theme-btn {
            padding: 10px 18px;
            border-radius: 14px;
            border: 2px solid #E2E8F0;
            cursor: pointer;
            font-weight: 600;
            background: white;
            margin-right: 8px;
            margin-bottom: 8px;
            font-family: inherit;
        }
        textarea, input[type="password"] {
            width: 100%;
            border-radius: 16px;
            border: 2px solid #E2E8F0;
            padding: 14px;
            font-size: 17px;
            font-family: inherit;
            box-sizing: border-box;
            outline: none;
            margin-top: 8px;
        }
        textarea { height: 120px; resize: vertical; }
        .controls {
            display: flex;
            gap: 10px;
            align-items: center;
            margin: 14px 0;
            flex-wrap: wrap;
        }
        .btn-action {
            color: white;
            border: none;
            padding: 12px 18px;
            border-radius: 16px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            font-family: inherit;
            transition: transform 0.2s;
        }
        .btn-action:hover { transform: scale(1.03); }
        .btn-female-tr { background: linear-gradient(135deg, #FD79A8, #E84393); }
        .btn-male-tr { background: linear-gradient(135deg, #0984E3, #74B9FF); }
        .btn-female-en { background: linear-gradient(135deg, #A29BFE, #6C5CE7); }
        .btn-male-en { background: linear-gradient(135deg, #55EFC4, #00B894); color: #2D3748; }

        .output-container {
            background-color: #FFFFFF;
            padding: 28px;
            border-radius: 20px;
            font-size: 24px;
            line-height: 2.3;
            border: 3px dashed var(--primary);
            min-height: 120px;
            margin-top: 20px;
        }
        .bionic-bold { color: var(--primary); font-weight: 800; }
        
        .word-span {
            cursor: pointer;
            padding: 2px 6px;
            border-radius: 6px;
            transition: background 0.1s;
        }
        .word-span:hover { background-color: #F1F2F6; }
        
        /* Fosforlu Okuma Işığı */
        .word-active {
            background-color: #FFF176 !important;
            color: #D35400 !important;
            font-weight: 900;
            border-bottom: 4px solid #FBC02D;
            border-radius: 6px;
        }
        
        .mode-box {
            background: #F8F9FA;
            padding: 16px;
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 12px;
            border-left: 5px solid var(--primary);
        }
        .radio-label {
            cursor: pointer;
            font-weight: 600;
            font-size: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        input[type="radio"] { transform: scale(1.2); }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1 style="margin:0;">🧪 Süper Beyin Laboratuvarı 🚀</h1>
        <p style="margin:8px 0 0 0; font-size:17px;">Kelimeleri Işılda, Sesleri Kendi Temponda Yönet!</p>
    </div>

    <!-- API Anahtarı ve AI OCR -->
    <div class="card" style="padding:18px; background:#F8F9FA;">
        <label><b>🔑 Laboratuvar Anahtarı & Sayfa Okuyucu (Gemini API):</b></label>
        <div style="display:flex; gap:10px; margin-top:10px; align-items:center; flex-wrap:wrap;">
            <input type="password" id="apiKeyInput" placeholder="API Anahtarı" style="max-width:200px; margin:0;" onchange="saveKey()">
            <input type="file" id="imageInput" accept="image/*">
            <span id="ocrProgress" style="display:none; color:var(--primary); font-weight:bold;">Sayfa okunuyor...</span>
        </div>
    </div>

    <div class="card">
        <!-- Zemin Işığı -->
        <label><b>🎨 Sayfa Işığı:</b></label><br>
        <div style="margin-top:10px;">
            <button class="theme-btn" onclick="setBg('#FEF9E7')">🍯 Bal Peteği</button>
            <button class="theme-btn" onclick="setBg('#E8F8F5')">🌱 Dinozor Nanesi</button>
            <button class="theme-btn" onclick="setBg('#FBEEE6')">🍑 Şeftali Bulutu</button>
            <button class="theme-btn" onclick="setBg('#EBF5FB')">🌊 Uzay Dalgası</button>
        </div>

        <label style="margin-top:18px; display:block;"><b>📝 Kâşifin Not Defteri:</b></label>
        <textarea id="textInput" oninput="applyBionic()">Bir zamanlar meraklı bir kâşif varmış. Bu kâşif yepyeni dünyalar keşfetmeye bayılırmış.</textarea>

        <!-- KESİN VE NET 3 OKUMA MODU -->
        <div class="mode-box">
            <span style="color:#2D3748; font-size:16px;">🧭 <b>Nasıl Okuyalım? (Modunu Seç!)</b></span>
            
            <label class="radio-label">
                <input type="radio" name="readMode" value="1" checked> 
                🎯 <b>1. Mod (Seçileni Oku):</b> Not defterinden (yukarıdan) veya okuma masasından (aşağıdan) yazıyı fareyle maviye boya. Sonra ses butonuna bas.
            </label>
            
            <label class="radio-label">
                <input type="radio" name="readMode" value="2"> 
                🚀 <b>2. Mod (Akıcı Okuma):</b> Aşağıdaki masada bir kelimeye TIKLA. Oradan itibaren normal konuşma hızıyla okur.
            </label>
            
            <label class="radio-label">
                <input type="radio" name="readMode" value="3"> 
                🐢 <b>3. Mod (Tane Tane Okuma):</b> Aşağıdaki masada bir kelimeye TIKLA. Ses ağırlaşır, kelimeler yavaş okunur.
            </label>
        </div>

        <!-- Biyonik Ayarı -->
        <div class="controls" style="margin-top:15px;">
            <label>✨ <b>Harf Işığı:</b></label>
            <input type="range" id="bionicRange" min="20" max="80" value="50" onchange="applyBionic()">
        </div>

        <!-- 4 SES BUTONU (Google AI Kadın Sesleri Garantili) -->
        <label style="display:block; margin-top:20px; font-size:16px;"><b>🎧 Ses Asistanları:</b></label>
        <div class="controls">
            <button class="btn-action btn-female-tr" onclick="playSelectedText('tr', 'female')">🧚 TR AI Kadın (Garantili)</button>
            <button class="btn-action btn-male-tr" onclick="playSelectedText('tr', 'male')">🧙‍♂️ TR Erkek</button>
            <button class="btn-action btn-female-en" onclick="playSelectedText('en', 'female')">👩‍🏫 EN AI Kadın</button>
            <button class="btn-action btn-male-en" onclick="playSelectedText('en', 'male')">👨‍🚀 EN Erkek</button>
            <button class="btn-action" style="background:#E17055;" onclick="stopAll()">⏹️ Durdur</button>
        </div>
    </div>

    <!-- OKUMA MASASI -->
    <div class="output-container" id="outputArea">
        <div id="textOutput">Yazılar burada parlayacak...</div>
    </div>
</div>

<script>
let wordsArray = [];
let isPlaying = false;
let globalAudio = new Audio();
let highlightTimer = null;
let currentLang = 'tr';
let currentGender = 'female';

function setBg(color) {
    document.documentElement.style.setProperty('--bg-color', color);
}

// Biyonik İşlem & Tıklanabilir Kelimeler
function applyBionic() {
    const text = document.getElementById('textInput').value.trim();
    if (!text) {
        document.getElementById('textOutput').innerHTML = "";
        return;
    }
    wordsArray = text.split(/\s+/);
    const transformed = wordsArray.map((word, idx) => {
        let bionicWord = word.length <= 2 
            ? `<span class="bionic-bold">${word}</span>` 
            : `<span class="bionic-bold">${word.slice(0, Math.ceil(word.length * (document.getElementById('bionicRange').value / 100)))}</span>${word.slice(Math.ceil(word.length * (document.getElementById('bionicRange').value / 100)))}`;
        return `<span class="word-span" id="w_${idx}" onclick="handleWordClick(${idx})">${bionicWord}</span>`;
    });
    document.getElementById('textOutput').innerHTML = transformed.join(' ');
}

function clearHighlight() {
    document.querySelectorAll('.word-span').forEach(el => el.classList.remove('word-active'));
}

function highlightWord(idx) {
    clearHighlight();
    const target = document.getElementById(`w_${idx}`);
    if (target) target.classList.add('word-active');
}

function stopAll() {
    isPlaying = false;
    clearInterval(highlightTimer);
    globalAudio.pause();
    globalAudio.src = "";
    window.speechSynthesis.cancel();
    clearHighlight();
}

// --------------------------------------------------------
// MOD 1: SADECE SEÇİLİ METNİ OKUMA
// --------------------------------------------------------
function playSelectedText(lang, gender) {
    currentLang = lang;
    currentGender = gender;
    
    const mode = document.querySelector('input[name="readMode"]:checked').value;
    
    if (mode === '1') {
        // Ekranda maviye boyanmış (seçilmiş) metni al
        let selText = window.getSelection().toString().trim();
        
        // Eğer okuma masasından seçmediyse, not defterinden seçileni al
        if (!selText) {
            const ta = document.getElementById('textInput');
            selText = ta.value.substring(ta.selectionStart, ta.selectionEnd).trim();
        }

        if (!selText) {
            alert("Lütfen okunmasını istediğin yazıyı fareyle KOPYALAR GİBİ SEÇ (maviye boya) ve tekrar butona bas!");
            return;
        }

        stopAll();
        // Kadın sesi ise doğrudan Google AI Sesini çal (Engel/Robotlaşma yok)
        if (gender === 'female') {
            const url = `https://translate.googleapis.com/translate_tts?ie=UTF-8&client=gtx&tl=${lang}&q=${encodeURIComponent(selText.substring(0, 195))}`;
            globalAudio.src = url;
            globalAudio.playbackRate = 1.0;
            globalAudio.play();
        } else {
            // Erkek sesi için tarayıcıyı kullan
            let utt = new SpeechSynthesisUtterance(selText);
            utt.lang = lang === 'tr' ? 'tr-TR' : 'en-US';
            const voices = window.speechSynthesis.getVoices();
            utt.voice = voices.find(v => v.lang.includes(lang) && (v.name.includes('Male') || v.name.includes('Tolga') || v.name.includes('David')));
            utt.pitch = 0.6;
            window.speechSynthesis.speak(utt);
        }
    } else {
        alert("Şu an Mod 2 veya Mod 3'tesin. Lütfen ses butonlarına basmak yerine doğrudan aşağıdaki MASADAN BİR KELİMEYE TIKLA!");
    }
}

// --------------------------------------------------------
// MOD 2 & MOD 3: KELİMEYE TIKLAYINCA İLERLEYEN AKIŞ
// --------------------------------------------------------
function handleWordClick(startIndex) {
    const mode = document.querySelector('input[name="readMode"]:checked').value;
    
    if (mode === '1') {
        alert("Şu an 1. Mod (Seçileni Oku) aktif. Işıklı ve akıcı okuma için 2. veya 3. Modu seçmelisin!");
        return;
    }

    playTextFlow(startIndex, mode, currentLang, currentGender);
}

async function playTextFlow(startIndex, mode, lang, gender) {
    stopAll();
    isPlaying = true;
    
    // Mod 3 ise sesi yavaşlat
    const speedRate = mode === '3' ? 0.65 : 1.0;

    if (gender === 'female') {
        // GOOGLE AI KADIN SESİ (Kusursuz Çözüm)
        let remainingWords = wordsArray.slice(startIndex);
        
        // Cümleleri 12 kelimelik bloklara böl (API engeline takılmamak için)
        let chunks = [];
        for (let i = 0; i < remainingWords.length; i += 12) {
            chunks.push({
                text: remainingWords.slice(i, i + 12).join(' '),
                startIdx: startIndex + i,
                wordCount: Math.min(12, remainingWords.length - i)
            });
        }

        for (let chunk of chunks) {
            if (!isPlaying) break;

            await new Promise((resolve) => {
                const url = `https://translate.googleapis.com/translate_tts?ie=UTF-8&client=gtx&tl=${lang}&q=${encodeURIComponent(chunk.text)}`;
                globalAudio.src = url;
                globalAudio.playbackRate = speedRate;
                
                globalAudio.onloadedmetadata = () => {
                    // Bloktaki ses uzunluğunu kelime sayısına bölerek canlı ışık takibi yap
                    let durationMs = (globalAudio.duration * 1000) / speedRate; 
                    let timePerWord = durationMs / chunk.wordCount;
                    
                    let wIdx = 0;
                    clearInterval(highlightTimer);
                    highlightTimer = setInterval(() => {
                        if (wIdx < chunk.wordCount) {
                            highlightWord(chunk.startIdx + wIdx);
                            wIdx++;
                        }
                    }, timePerWord);
                };

                globalAudio.onended = () => {
                    clearInterval(highlightTimer);
                    resolve();
                };
                globalAudio.onerror = resolve; // Hata olursa sonrakine geç

                globalAudio.play().catch(e => resolve());
            });
        }
        clearHighlight();

    } else {
        // TARAYICI ERKEK SESİ
        let textToPlay = wordsArray.slice(startIndex).join(' ');
        let cleanText = textToPlay.replace(/kâ/gi, "kyaa").replace(/gâ/gi, "gyaa").replace(/lâ/gi, "lyaa");
        
        let utt = new SpeechSynthesisUtterance(cleanText);
        utt.lang = lang === 'tr' ? 'tr-TR' : 'en-US';
        utt.rate = speedRate;
        utt.pitch = 0.6;
        
        const voices = window.speechSynthesis.getVoices();
        utt.voice = voices.find(v => v.lang.includes(lang) && (v.name.includes('Male') || v.name.includes('Tolga') || v.name.includes('David')));

        let currentGlobalIndex = startIndex;
        utt.onboundary = function(e) {
            if (e.name === 'word') {
                let textUpTo = textToPlay.substring(0, e.charIndex);
                let localIdx = textUpTo.trim() === "" ? 0 : textUpTo.trim().split(/\s+/).length;
                highlightWord(currentGlobalIndex + localIdx);
            }
        };
        utt.onend = clearHighlight;
        window.speechSynthesis.speak(utt);
    }
}

// API Kaydet
function saveKey() {
    const k = document.getElementById('apiKeyInput').value.trim();
    if (k) localStorage.setItem('superbrain_gemini_key', k);
}
window.onload = () => {
    const k = localStorage.getItem('superbrain_gemini_key');
    if (k) document.getElementById('apiKeyInput').value = k;
    applyBionic();
};

// GEMINI OCR (Sıfır Hata)
document.getElementById('imageInput').addEventListener('change', function(e) {
    const file = e.target.files[0];
    if (!file) return;

    const apiKey = document.getElementById('apiKeyInput').value.trim();
    if (!apiKey) {
        alert("Lütfen önce API Anahtarını girin.");
        return;
    }

    const prog = document.getElementById('ocrProgress');
    prog.style.display = 'inline-block';

    const reader = new FileReader();
    reader.readAsDataURL(file);
    reader.onload = (event) => {
        const img = new Image();
        img.src = event.target.result;
        img.onload = async () => {
            const canvas = document.createElement('canvas');
            const MAX_WIDTH = 1000;
            let width = img.width, height = img.height;
            if (width > MAX_WIDTH) { height = Math.round(height * MAX_WIDTH / width); width = MAX_WIDTH; }
            canvas.width = width; canvas.height = height;
            canvas.getContext('2d').drawImage(img, 0, 0, width, height);

            const optimizedBase64 = canvas.toDataURL('image/jpeg', 0.8).split(',')[1];

            try {
                const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{
                            parts: [
                                { text: "Görseldeki yazıyı harfi harfine oku. Yalnızca metni aktar." },
                                { inline_data: { mime_type: "image/jpeg", data: optimizedBase64 } }
                            ]
                        }]
                    })
                });
                const data = await res.json();
                if (data.candidates && data.candidates[0].content.parts[0].text) {
                    document.getElementById('textInput').value = data.candidates[0].content.parts[0].text.trim();
                    applyBionic();
                }
            } catch (err) { alert("Hata oluştu."); } 
            finally { prog.style.display = 'none'; }
        };
    };
});
</script>

</body>
</html>
