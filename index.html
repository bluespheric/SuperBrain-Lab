<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Süper Beyin Laboratuvarı</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #FEF9E7;
            --primary: #6C5CE7;
            --accent: #FD79A8;
        }
        body {
            font-family: 'Fredoka', sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 24px;
            color: #2D3748;
            transition: background-color 0.3s ease;
        }
        .container {
            max-width: 880px;
            margin: 0 auto;
        }
        .header {
            background: linear-gradient(135deg, #6C5CE7, #a29bfe);
            color: white;
            padding: 24px;
            border-radius: 24px;
            text-align: center;
            box-shadow: 0 8px 24px rgba(108, 92, 231, 0.2);
            margin-bottom: 24px;
        }
        .card {
            background: #FFFFFF;
            padding: 24px;
            border-radius: 20px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.05);
            margin-bottom: 20px;
        }
        .theme-btn {
            padding: 10px 18px;
            border-radius: 14px;
            border: 2px solid #E2E8F0;
            cursor: pointer;
            font-weight: 600;
            background: white;
            margin-right: 8px;
            margin-bottom: 8px;
            font-family: inherit;
            transition: all 0.2s;
        }
        .theme-btn:hover {
            border-color: var(--primary);
            transform: translateY(-2px);
        }
        textarea, input[type="password"] {
            width: 100%;
            border-radius: 16px;
            border: 2px solid #E2E8F0;
            padding: 14px;
            font-size: 16px;
            font-family: inherit;
            box-sizing: border-box;
            outline: none;
            margin-top: 8px;
        }
        textarea { height: 110px; resize: vertical; }
        .controls {
            display: flex;
            gap: 10px;
            align-items: center;
            margin: 14px 0;
            flex-wrap: wrap;
        }
        .btn-action {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 11px 18px;
            border-radius: 16px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            font-family: inherit;
            box-shadow: 0 4px 12px rgba(108, 92, 231, 0.2);
            transition: transform 0.2s;
        }
        .btn-action:hover { transform: scale(1.03); }
        .btn-save { background: #00B894; }
        .btn-female-tr { background: linear-gradient(135deg, #FD79A8, #E84393); }
        .btn-male-tr { background: linear-gradient(135deg, #0984E3, #74B9FF); }
        .btn-female-en { background: linear-gradient(135deg, #A29BFE, #6C5CE7); }
        .btn-male-en { background: linear-gradient(135deg, #55EFC4, #00B894); color: #2D3748; }

        .output-container {
            position: relative;
            background-color: #FFFFFF;
            padding: 28px;
            border-radius: 20px;
            font-size: 24px;
            line-height: 2.3;
            border: 3px dashed var(--primary);
            min-height: 120px;
            margin-top: 20px;
        }
        .reading-ruler {
            position: absolute;
            left: 0;
            right: 0;
            height: 52px;
            background: rgba(255, 234, 167, 0.45);
            border-top: 2px solid #FDCB6E;
            border-bottom: 2px solid #FDCB6E;
            pointer-events: none;
            display: none;
        }
        .bionic-bold { color: var(--primary); font-weight: 800; }
        .upload-zone {
            background: #F8F9FA;
            border: 2px dashed #CBD5E0;
            padding: 18px;
            border-radius: 16px;
            margin-top: 14px;
            text-align: center;
        }
        .status-msg {
            margin-top: 8px;
            font-weight: 600;
            font-size: 14px;
        }
        
        .word-span {
            cursor: pointer;
            padding: 2px 4px;
            border-radius: 6px;
            transition: background 0.15s ease;
        }
        .word-span:hover {
            background-color: rgba(108, 92, 231, 0.1);
        }
        .word-active {
            background-color: #FFEAA7 !important;
            border-bottom: 3px solid #FDCB6E;
        }
        .mode-selector {
            background: #F1F2F6;
            padding: 6px 12px;
            border-radius: 12px;
            display: inline-flex;
            gap: 12px;
            font-weight: 600;
            font-size: 14px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1 style="margin:0;">🧪 Süper Beyin Laboratuvarı 🚀</h1>
        <p style="margin:8px 0 0 0; font-size:17px;">Kelimeleri Işılda, Kendi Temponda Rahatça Keşfet!</p>
    </div>

    <!-- Laboratuvar Anahtarı -->
    <div class="card" style="background:#FFFDF5; border:2px solid #FEF3C7;">
        <label><b>🔑 Laboratuvar Anahtarı (Gemini API):</b></label>
        <div style="display:flex; gap:10px; margin-top:8px;">
            <input type="password" id="apiKeyInput" placeholder="AIzaSy... anahtarını buraya yapıştır">
            <button class="btn-action btn-save" onclick="saveKey()">💾 Anahtarı Hafızaya Kaydet</button>
        </div>
        <div id="keyStatus" class="status-msg" style="color:#00B894;"></div>
    </div>

    <div class="card">
        <!-- Sayfa Işığı -->
        <label><b>🎨 Sayfa Işığı:</b></label><br>
        <div style="margin-top:10px;">
            <button class="theme-btn" onclick="setBg('#FEF9E7')">🍯 Bal Peteği</button>
            <button class="theme-btn" onclick="setBg('#E8F8F5')">🌱 Dinozor Nanesi</button>
            <button class="theme-btn" onclick="setBg('#FBEEE6')">🍑 Şeftali Bulutu</button>
            <button class="theme-btn" onclick="setBg('#EBF5FB')">🌊 Uzay Dalgası</button>
        </div>

        <!-- Akıllı Görsel Okuyucu -->
        <div class="upload-zone">
            <b>📸 Kitabının Sayfasını Yükle (Akıllı Okuyucu)</b>
            <input type="file" id="imageInput" accept="image/*" style="display:block; margin:12px auto;">
            <div id="ocrProgress" class="status-msg" style="display:none; color:var(--primary);">🪄 Gemini 3.6 sayfayı inceliyor, metin aktarılıyor...</div>
        </div>

        <!-- Metin Kutusu -->
        <label style="margin-top:18px; display:block;"><b>📝 Kâşifin Not Defteri:</b></label>
        <textarea id="textInput" oninput="applyBionic()">Bir zamanlar meraklı bir kâşif varmış. Bu kâşif Süper Beyin Laboratuvarında yepyeni dünyalar keşfetmeye bayılırmış.</textarea>

        <!-- Okuma Modu Seçici -->
        <div style="margin-top:12px; display:flex; align-items:center; gap:10px; flex-wrap:wrap;">
            <b>🧭 Okuma Tarzı:</b>
            <div class="mode-selector">
                <label style="cursor:pointer;"><input type="radio" name="readMode" value="selected" checked> 🎯 Seçileni Oku</label>
                <label style="cursor:pointer;"><input type="radio" name="readMode" value="slow"> 🐢 Tane Tane (Işık Takibi)</label>
                <label style="cursor:pointer;"><input type="radio" name="readMode" value="fast"> 🚀 Seri & Akıcı (Işık Takibi)</label>
            </div>
        </div>

        <!-- Harf Işığı & Cetvel -->
        <div class="controls">
            <label>✨ <b>Harf Işığı:</b></label>
            <input type="range" id="bionicRange" min="20" max="80" value="50" onchange="applyBionic()">
            <button class="btn-action" onclick="applyBionic()">✨ Kelimeleri Parlat</button>
            
            <label style="margin-left:14px; cursor:pointer; font-weight:600;">
                <input type="checkbox" id="rulerToggle" onchange="toggleRuler()"> 📏 <b>Sihirli Takip Çubuğu</b>
            </label>
        </div>

        <!-- Duygulu AI Ses İstasyonu -->
        <label style="display:block; margin-top:14px;"><b>🎧 Sesli Anlatıcı (Yapay Zeka & Doğal Duygu):</b></label>
        <div class="controls">
            <button class="btn-action btn-female-tr" onclick="executeRead('tr-female')">🧚 Masalcı Peri (TR Kadın)</button>
            <button class="btn-action btn-male-tr" onclick="executeRead('tr-male')">🧙‍♂️ Bilge Kâşif (TR Erkek)</button>
            <button class="btn-action btn-female-en" onclick="executeRead('en-female')">👩‍🏫 Storyteller (EN Kadın)</button>
            <button class="btn-action btn-male-en" onclick="executeRead('en-male')">👨‍🚀 Captain Explorer (EN Erkek)</button>
            <button class="btn-action" style="background:#E17055;" onclick="stopAllSpeech()">⏹️ Durdur</button>
        </div>
        <div id="aiVoiceStatus" class="status-msg" style="color:var(--primary); display:none;">✨ Yapay zeka duygulu sesi hazırlıyor...</div>
    </div>

    <!-- Okuma Masası (Kelimelere Tıklanabilir) -->
    <div class="output-container" id="outputArea" onmousemove="moveRuler(event)">
        <div id="ruler" class="reading-ruler"></div>
        <div id="textOutput">Yazılar burada parlayacak...</div>
    </div>
</div>

<audio id="geminiAudioPlayer"></audio>

<script>
let wordsList = [];
let activeTimer = null;
let lastVoice = 'tr-female';

function setBg(color) {
    document.documentElement.style.setProperty('--bg-color', color);
}

// Biyonik Kelime Rehberi & Tıklanabilir Yapı
function applyBionic() {
    const text = document.getElementById('textInput').value;
    const ratio = document.getElementById('bionicRange').value / 100;
    if (!text.trim()) {
        document.getElementById('textOutput').innerHTML = "Yazılar burada parlayacak...";
        return;
    }

    wordsList = text.trim().split(/\s+/);
    const transformed = wordsList.map((word, idx) => {
        let bionicWord = "";
        if (word.length <= 2) {
            bionicWord = `<span class="bionic-bold">${word}</span>`;
        } else {
            const mid = Math.ceil(word.length * ratio);
            bionicWord = `<span class="bionic-bold">${word.slice(0, mid)}</span>${word.slice(mid)}`;
        }
        return `<span class="word-span" id="w_${idx}" onclick="onWordClick(${idx})">${bionicWord}</span>`;
    });

    document.getElementById('textOutput').innerHTML = transformed.join(' ');
}

// Kelimeye Tıklayınca Oradan İtibaren Dinleme
function onWordClick(idx) {
    playModeFlow(idx, lastVoice);
}

// Cetvel
function toggleRuler() {
    const ruler = document.getElementById('ruler');
    ruler.style.display = document.getElementById('rulerToggle').checked ? 'block' : 'none';
}
function moveRuler(e) {
    const ruler = document.getElementById('ruler');
    if (ruler.style.display === 'block') {
        const rect = document.getElementById('outputArea').getBoundingClientRect();
        const offsetY = e.clientY - rect.top - 24;
        ruler.style.top = Math.max(0, Math.min(offsetY, rect.height - 52)) + 'px';
    }
}

// API Kaydetme
function saveKey() {
    const k = document.getElementById('apiKeyInput').value.trim();
    if (k) {
        localStorage.setItem('superbrain_gemini_key', k);
        document.getElementById('keyStatus').innerText = "✓ Anahtar hafızaya kaydedildi!";
    }
}
window.onload = () => {
    const k = localStorage.getItem('superbrain_gemini_key');
    if (k) {
        document.getElementById('apiKeyInput').value = k;
        document.getElementById('keyStatus').innerText = "✓ Kayıtlı anahtar hazır!";
    }
    applyBionic();
};

function highlightWord(idx) {
    document.querySelectorAll('.word-span').forEach(el => el.classList.remove('word-active'));
    const target = document.getElementById(`w_${idx}`);
    if (target) target.classList.add('word-active');
}

function stopAllSpeech() {
    clearTimeout(activeTimer);
    const player = document.getElementById('geminiAudioPlayer');
    player.pause();
    player.src = "";
    window.speechSynthesis.cancel();
    document.querySelectorAll('.word-span').forEach(el => el.classList.remove('word-active'));
    document.getElementById('aiVoiceStatus').style.display = 'none';
}

// ANA ÇALIŞTIRICI: Seçili Mod Kontrolü
function executeRead(voiceType) {
    lastVoice = voiceType;
    const mode = document.querySelector('input[name="readMode"]:checked').value;
    const textarea = document.getElementById('textInput');

    // 1. MOD: Sadece Seçilen Metni Oku
    if (mode === 'selected') {
        let textToSpeak = "";
        if (textarea.selectionStart !== textarea.selectionEnd) {
            textToSpeak = textarea.value.substring(textarea.selectionStart, textarea.selectionEnd).trim();
        } else {
            textToSpeak = textarea.value.trim();
        }
        playAIAudio(textToSpeak, voiceType);
        return;
    }

    // 2. & 3. MOD: Işık Takibi (Tane Tane veya Seri)
    playModeFlow(0, voiceType);
}

// Işık Takibiyle Okuma Akışı
function playModeFlow(startIdx, voiceType) {
    stopAllSpeech();
    const mode = document.querySelector('input[name="readMode"]:checked').value;
    const delay = mode === 'slow' ? 620 : 360; // Tane tane: 620ms, Seri: 360ms

    const remainingWords = wordsList.slice(startIdx);
    if (remainingWords.length === 0) return;

    const fullText = remainingWords.join(' ');
    playAIAudio(fullText, voiceType);

    // Işık takibi zamanlayıcısı
    let current = startIdx;
    function stepHighlight() {
        if (current < wordsList.length) {
            highlightWord(current);
            current++;
            activeTimer = setTimeout(stepHighlight, delay);
        } else {
            document.querySelectorAll('.word-span').forEach(el => el.classList.remove('word-active'));
        }
    }
    stepHighlight();
}

// GEMINI AI DUYGULU SES MOTORU (Kadın / Erkek / TR / EN)
async function playAIAudio(text, voiceType) {
    if (!text.trim()) return;

    const apiKey = localStorage.getItem('superbrain_gemini_key');
    const status = document.getElementById('aiVoiceStatus');

    // API anahtarı varsa Gemini 3.6 Audio TTS ile gerçekçi ve duygulu ses üretir
    if (apiKey) {
        status.style.display = 'block';
        status.innerText = "✨ Yapay zeka duygulu ve doğal tonlamayla okuyor...";

        // Ses persona modelleri: Aoede/Puck (Kadın), Fenrir/Charon (Erkek)
        let voiceName = "Aoede"; // Varsayılan Kadın
        if (voiceType === 'tr-male' || voiceType === 'en-male') voiceName = "Fenrir"; // Erkek

        try {
            const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent?key=${apiKey}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    contents: [{ parts: [{ text: `Lütfen şu metni bir masalcı zarafetiyle, yumuşak, duygulu ve tamamen akıcı bir tonda seslendir: ${text}` }] }],
                    generationConfig: {
                        responseModalities: ["AUDIO"],
                        speechConfig: {
                            voiceConfig: {
                                prebuiltVoiceConfig: { voiceName: voiceName }
                            }
                        }
                    }
                })
            });

            const data = await res.json();
            const part = data.candidates?.[0]?.content?.parts?.[0];
            
            if (part && part.inlineData && part.inlineData.data) {
                const audioBlob = pcmToWavBlob(part.inlineData.data, 24000);
                const audioUrl = URL.createObjectURL(audioBlob);
                const player = document.getElementById('geminiAudioPlayer');
                player.src = audioUrl;
                player.play();
                status.style.display = 'none';
                return;
            }
        } catch (e) {
            // API kotası dolarsa yedek tarayıcı motoruna pürüzsüz geç
        }
        status.style.display = 'none';
    }

    // Yedek Doğal Sentezleyici
    fallbackSpeech(text, voiceType);
}

// Base64 PCM formatını tarayıcının çalabileceği WAV sesine dönüştürücü
function pcmToWavBlob(base64Data, sampleRate) {
    const byteCharacters = atob(base64Data);
    const byteNumbers = new Array(byteCharacters.length);
    for (let i = 0; i < byteCharacters.length; i++) {
        byteNumbers[i] = byteCharacters.charCodeAt(i);
    }
    const byteArray = new Uint8Array(byteNumbers);
    const pcm16 = new Int16Array(byteArray.buffer);

    const buffer = new ArrayBuffer(44 + pcm16.length * 2);
    const view = new DataView(buffer);

    function writeString(view, offset, string) {
        for (let i = 0; i < string.length; i++) {
            view.setUint8(offset + i, string.charCodeAt(i));
        }
    }

    writeString(view, 0, 'RIFF');
    view.setUint32(4, 36 + pcm16.length * 2, true);
    writeString(view, 8, 'WAVE');
    writeString(view, 12, 'fmt ');
    view.setUint32(16, 16, true);
    view.setUint16(20, 1, true);
    view.setUint16(22, 1, true); // Mono
    view.setUint32(24, sampleRate, true);
    view.setUint32(28, sampleRate * 2, true);
    view.setUint16(32, 2, true);
    view.setUint16(34, 16, true);
    writeString(view, 36, 'data');
    view.setUint32(40, pcm16.length * 2, true);

    for (let i = 0; i < pcm16.length; i++) {
        view.setInt16(44 + i * 2, pcm16[i], true);
    }

    return new Blob([view], { type: 'audio/wav' });
}

function fallbackSpeech(text, voiceType) {
    window.speechSynthesis.cancel();
    const utt = new SpeechSynthesisUtterance(text);
    const voices = window.speechSynthesis.getVoices();

    if (voiceType.startsWith('tr')) {
        utt.lang = 'tr-TR';
        const v = voices.find(vo => vo.lang.startsWith('tr'));
        if (v) utt.voice = v;
        utt.pitch = voiceType === 'tr-female' ? 1.5 : 0.65;
    } else {
        utt.lang = 'en-US';
        const v = voices.find(vo => vo.lang.startsWith('en'));
        if (v) utt.voice = v;
        utt.pitch = voiceType === 'en-female' ? 1.15 : 0.8;
    }
    utt.rate = 0.92;
    window.speechSynthesis.speak(utt);
}
window.speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();

// GEMINI 3.6 OCR (Sıfır Hata)
document.getElementById('imageInput').addEventListener('change', function(e) {
    const file = e.target.files[0];
    if (!file) return;

    const apiKey = localStorage.getItem('superbrain_gemini_key');
    if (!apiKey) {
        alert("Lütfen en üstteki alana Laboratuvar Anahtarını kaydedin!");
        return;
    }

    const prog = document.getElementById('ocrProgress');
    prog.style.display = 'block';

    const reader = new FileReader();
    reader.readAsDataURL(file);
    reader.onload = (event) => {
        const img = new Image();
        img.src = event.target.result;
        img.onload = async () => {
            const canvas = document.createElement('canvas');
            const MAX_WIDTH = 1200;
            let width = img.width;
            let height = img.height;
            if (width > MAX_WIDTH) {
                height = Math.round((height * MAX_WIDTH) / width);
                width = MAX_WIDTH;
            }
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);

            const optimizedBase64 = canvas.toDataURL('image/jpeg', 0.85).split(',')[1];

            try {
                const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{
                            parts: [
                                { text: "Bu görseldeki yazıyı harfi harfine oku. Yalnızca metni aktar." },
                                { inline_data: { mime_type: "image/jpeg", data: optimizedBase64 } }
                            ]
                        }]
                    })
                });
                const data = await res.json();
                if (data.candidates && data.candidates[0].content.parts[0].text) {
                    document.getElementById('textInput').value = data.candidates[0].content.parts[0].text.trim();
                    applyBionic();
                }
            } catch (err) {
                alert("Bağlantı hatası!");
            } finally {
                prog.style.display = 'none';
            }
        };
    };
});
</script>

</body>
</html>
